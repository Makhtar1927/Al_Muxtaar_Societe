<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-width:100%;display:block;background:#ffffff;border-radius:16px;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <style>
      @keyframes pulseAlpha {
        0%, 100% { r: 5px; fill-opacity: 1; }
        50% { r: 8px; fill-opacity: 0.5; }
      }
      @keyframes sweepScan {
        0% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(70px); opacity: 0.8; }
        100% { transform: translateY(140px); opacity: 0.2; }
      }
      .curve { stroke: #0B6477; stroke-width: 3.5; fill: none; stroke-linecap: round; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis { stroke: #143048; stroke-width: 2; stroke-linecap: round; }
      .guide-line { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .k-line { stroke: #F59E0B; stroke-width: 2.5; stroke-dasharray: 6 4; }
      .alpha-point { animation: pulseAlpha 2s ease-in-out infinite; }
      .interval-highlight { fill: #CCFBF1; opacity: 0.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#143048"/>
    </marker>
  </defs>

  <!-- En-tête -->
  <rect x="0" y="0" width="700" height="50" fill="#F8FAFC" rx="16"/>
  <text x="25" y="32" font-size="14" font-weight="bold" fill="#143048">Théorème des Valeurs Intermédiaires (TVI) &amp; Corollaire d&apos;Unicité</text>
  <rect x="480" y="14" width="195" height="24" rx="12" fill="#FEF3C7"/>
  <text x="577" y="30" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">f continue &amp; stricte ⟹ unique α</text>

  <!-- Axes -->
  <line x1="80" y1="310" x2="640" y2="310" class="axis" marker-end="url(#arrow)" />
  <line x1="100" y1="320" x2="100" y2="70" class="axis" marker-end="url(#arrow)" />
  <text x="635" y="330" font-size="13" font-weight="bold" fill="#143048">x</text>
  <text x="85" y="75" font-size="13" font-weight="bold" fill="#143048">y</text>

  <!-- Intervalle [a, b] sur l'axe x -->
  <rect x="180" y="70" width="280" height="240" class="interval-highlight"/>

  <!-- Lignes directrices de a et f(a) -->
  <line x1="180" y1="310" x2="180" y2="260" class="guide-line" />
  <line x1="100" y1="260" x2="180" y2="260" class="guide-line" />
  <text x="180" y="330" font-size="13" font-weight="bold" fill="#143048" text-anchor="middle">a</text>
  <text x="85" y="265" font-size="12" font-weight="bold" fill="#143048" text-anchor="end">f(a)</text>

  <!-- Lignes directrices de b et f(b) -->
  <line x1="460" y1="310" x2="460" y2="120" class="guide-line" />
  <line x1="100" y1="120" x2="460" y2="120" class="guide-line" />
  <text x="460" y="330" font-size="13" font-weight="bold" fill="#143048" text-anchor="middle">b</text>
  <text x="85" y="125" font-size="12" font-weight="bold" fill="#143048" text-anchor="end">f(b)</text>

  <!-- Ligne horizontale de la valeur k -->
  <line x1="100" y1="190" x2="620" y2="190" class="k-line" />
  <text x="85" y="195" font-size="13" font-weight="bold" fill="#D97706" text-anchor="end">k</text>
  <text x="590" y="180" font-size="11" font-weight="bold" fill="#D97706">Droite y = k</text>

  <!-- Courbe f(x) continue strictement croissante -->
  <path d="M 140 290 C 170 270, 240 230, 310 190 C 380 150, 430 130, 480 110" class="curve" />
  <text x="490" y="105" font-size="13" font-weight="bold" fill="#0B6477">𝓒_f (continue)</text>

  <!-- Point alpha (intersection avec y = k) -->
  <line x1="310" y1="310" x2="310" y2="190" stroke="#0D9488" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="310" cy="190" r="6" fill="#0D9488" class="alpha-point"/>
  <circle cx="310" cy="310" r="4.5" fill="#0D9488"/>
  <text x="310" y="330" font-size="14" font-weight="black" fill="#0D9488" text-anchor="middle">α</text>

  <!-- Badge de conclusion aéré et lisible -->
  <rect x="460" y="225" width="220" height="78" rx="10" fill="#F8FAFC" stroke="#0D9488" stroke-width="1.5"/>
  <text x="475" y="247" font-size="11.5" font-weight="bold" fill="#143048">Les 3 conditions du Bac :</text>
  <text x="475" y="264" font-size="10.5" fill="#475569">1. f est continue sur [a, b]</text>
  <text x="475" y="279" font-size="10.5" fill="#475569">2. f est strictement monotone</text>
  <text x="475" y="294" font-size="11" font-weight="bold" fill="#0D9488">⟹ Unique solution f(α) = k</text>
</svg>
