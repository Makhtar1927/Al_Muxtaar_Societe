<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%" style="background:#081521; font-family:system-ui, -apple-system, sans-serif; border-radius:16px;">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#143048"/>
      <stop offset="100%" stop-color="#00B8A9"/>
    </linearGradient>
    <filter id="glowSuit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Titre Principal -->
  <text x="420" y="32" fill="#FFFFFF" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">
    THÉORÈME DE CONVERGENCE MONOTONE : SUITE CROISSANTE &amp; MAJORÉE
  </text>

  <!-- Grille d'arrière-plan -->
  <g stroke="#143048" stroke-width="1" opacity="0.4">
    <line x1="80" y1="50" x2="80" y2="380"/>
    <line x1="160" y1="50" x2="160" y2="380"/>
    <line x1="240" y1="50" x2="240" y2="380"/>
    <line x1="320" y1="50" x2="320" y2="380"/>
    <line x1="400" y1="50" x2="400" y2="380"/>
    <line x1="480" y1="50" x2="480" y2="380"/>
    <line x1="560" y1="50" x2="560" y2="380"/>
    <line x1="640" y1="50" x2="640" y2="380"/>
    <line x1="720" y1="50" x2="720" y2="380"/>
    <line x1="800" y1="50" x2="800" y2="380"/>

    <line x1="50" y1="90" x2="800" y2="90"/>
    <line x1="50" y1="150" x2="800" y2="150"/>
    <line x1="50" y1="210" x2="800" y2="210"/>
    <line x1="50" y1="270" x2="800" y2="270"/>
    <line x1="50" y1="330" x2="800" y2="330"/>
  </g>

  <!-- Axes -->
  <!-- Axe On (indices discrets) -->
  <line x1="60" y1="360" x2="800" y2="360" stroke="#718BA5" stroke-width="2.5"/>
  <polygon points="800,360 790,355 790,365" fill="#718BA5"/>
  <text x="795" y="380" fill="#A0B9D1" font-size="14" font-weight="bold">n (indices)</text>

  <!-- Axe Ou (valeurs de la suite) -->
  <line x1="100" y1="380" x2="100" y2="50" stroke="#718BA5" stroke-width="2.5"/>
  <polygon points="100,50 95,60 105,60" fill="#718BA5"/>
  <text x="70" y="60" fill="#A0B9D1" font-size="14" font-weight="bold">uₙ</text>

  <!-- Majorant M (Barrière infranchissable) -->
  <line x1="80" y1="110" x2="800" y2="110" stroke="#FF5E3A" stroke-width="2.5" stroke-dasharray="6,4"/>
  <rect x="630" y="75" width="165" height="28" rx="6" fill="#143048" stroke="#FF5E3A" stroke-width="1.5"/>
  <text x="712" y="94" fill="#FF5E3A" font-size="11" font-weight="900" text-anchor="middle">Majorant M : uₙ ≤ M</text>
  <text x="60" y="115" fill="#FF5E3A" font-size="14" font-weight="900">M</text>

  <!-- Limite L (vers laquelle converge la suite) -->
  <line x1="80" y1="130" x2="800" y2="130" stroke="#38EF7D" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="60" y="135" fill="#38EF7D" font-size="14" font-weight="900">L</text>
  <text x="712" y="145" fill="#38EF7D" font-size="11" font-weight="bold" text-anchor="middle">Limite finie : lim uₙ = L ≤ M</text>

  <!-- Points discrets de la suite (u0, u1, u2, u3, u4, u5, u6, u7, u8, u9...) -->
  <!-- n=0 : x=140, y=320 (u0 = 0.5) -->
  <line x1="140" y1="360" x2="140" y2="320" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="140" cy="320" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="140" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">0</text>
  <text x="140" y="310" fill="#00B8A9" font-size="11" font-weight="bold" text-anchor="middle">u₀</text>

  <!-- n=1 : x=200, y=260 -->
  <line x1="200" y1="360" x2="200" y2="260" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="200" cy="260" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="200" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <text x="200" y="250" fill="#00B8A9" font-size="11" font-weight="bold" text-anchor="middle">u₁</text>

  <!-- n=2 : x=260, y=215 -->
  <line x1="260" y1="360" x2="260" y2="215" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="260" cy="215" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="260" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <text x="260" y="205" fill="#00B8A9" font-size="11" font-weight="bold" text-anchor="middle">u₂</text>

  <!-- n=3 : x=320, y=185 -->
  <line x1="320" y1="360" x2="320" y2="185" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="320" cy="185" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="320" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <text x="320" y="175" fill="#00B8A9" font-size="11" font-weight="bold" text-anchor="middle">u₃</text>

  <!-- n=4 : x=380, y=165 -->
  <line x1="380" y1="360" x2="380" y2="165" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="380" cy="165" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="380" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">4</text>

  <!-- n=5 : x=440, y=152 -->
  <line x1="440" y1="360" x2="440" y2="152" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="440" cy="152" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="440" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">5</text>

  <!-- n=6 : x=500, y=143 -->
  <line x1="500" y1="360" x2="500" y2="143" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="500" cy="143" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="500" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">6</text>

  <!-- n=7 : x=560, y=137 -->
  <line x1="560" y1="360" x2="560" y2="137" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="560" cy="137" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="560" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">7</text>

  <!-- n=8 : x=620, y=133 -->
  <line x1="620" y1="360" x2="620" y2="133" stroke="url(#barGrad)" stroke-width="3"/>
  <circle cx="620" cy="133" r="6" fill="#00B8A9" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowSuit)"/>
  <text x="620" y="380" fill="#A0B9D1" font-size="12" font-weight="bold" text-anchor="middle">8</text>

  <!-- Ligne courbe enveloppe d'accumulation -->
  <path d="M 140,320 Q 240,220 380,165 T 620,133 T 780,130" 
        fill="none" stroke="#F7B731" stroke-width="2.5" stroke-dasharray="5,4"/>

  <!-- Encadré Réflexe Bac S2 -->
  <rect x="140" y="55" width="450" height="42" rx="10" fill="#0E2438" stroke="#00B8A9" stroke-width="1.5"/>
  <text x="365" y="75" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">
    Toute suite croissante et majorée est convergente vers un réel L ≤ M
  </text>
  <text x="365" y="91" fill="#38EF7D" font-size="11" font-weight="bold" text-anchor="middle">
    Toute suite décroissante et minorée est convergente vers un réel l ≥ m
  </text>
</svg>

