<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#00BBF9"/>
      <stop offset="100%" stop-color="#48CAE4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond style Al Muxtaar Navy -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Grille discrète -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="80" y1="60" x2="740" y2="60"/>
    <line x1="80" y1="120" x2="740" y2="120"/>
    <line x1="80" y1="180" x2="740" y2="180"/>
    <line x1="80" y1="240" x2="740" y2="240"/>
    <line x1="80" y1="300" x2="740" y2="300"/>
    <line x1="80" y1="360" x2="740" y2="360"/>
    <line x1="80" y1="420" x2="740" y2="420"/>

    <line x1="140" y1="40" x2="140" y2="440"/>
    <line x1="220" y1="40" x2="220" y2="440"/>
    <line x1="300" y1="40" x2="300" y2="440"/>
    <line x1="380" y1="40" x2="380" y2="440"/>
    <line x1="460" y1="40" x2="460" y2="440"/>
    <line x1="540" y1="40" x2="540" y2="440"/>
    <line x1="620" y1="40" x2="620" y2="440"/>
    <line x1="700" y1="40" x2="700" y2="440"/>
  </g>

  <!-- Axes du repère : Origine à (140, 300) -->
  <!-- Axe Ox -->
  <line x1="90" y1="300" x2="750" y2="300" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="750,300 740,295 740,305" fill="#94A3B8"/>
  <text x="755" y="305" fill="#94A3B8" font-size="14" font-family="sans-serif" font-weight="bold">x</text>

  <!-- Axe Oy / Asymptote Verticale x = 0 -->
  <line x1="140" y1="440" x2="140" y2="50" stroke="#FF6B6B" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="140,50 135,60 145,60" fill="#FF6B6B"/>
  <text x="145" y="45" fill="#FF6B6B" font-size="13" font-family="sans-serif" font-weight="bold">Asymptote x = 0 (axe Oy)</text>

  <!-- Graduations -->
  <!-- Origine O -->
  <text x="122" y="318" fill="#94A3B8" font-size="13" font-family="sans-serif">O</text>

  <!-- x = 1 (px = 220, y = 300) -->
  <line x1="220" y1="295" x2="220" y2="305" stroke="#FFFFFF" stroke-width="2"/>
  <text x="215" y="325" fill="#00F5D4" font-size="15" font-family="sans-serif" font-weight="bold">1</text>
  <circle cx="220" cy="300" r="5" fill="#00F5D4" filter="url(#glow)"/>

  <!-- x = e ≈ 2.718 (px = 140 + 80*2.718 = 357, py = 300 - 80*1 = 220) -->
  <line x1="357" y1="295" x2="357" y2="305" stroke="#FFFFFF" stroke-width="2"/>
  <text x="350" y="325" fill="#FBBF24" font-size="15" font-family="sans-serif" font-weight="bold">e ≈ 2,72</text>
  <line x1="357" y1="300" x2="357" y2="220" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="140" y1="220" x2="357" y2="220" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="357" cy="220" r="5" fill="#FBBF24" filter="url(#glow)"/>
  <text x="115" y="225" fill="#FBBF24" font-size="14" font-family="sans-serif" font-weight="bold">1</text>
  <text x="368" y="215" fill="#FBBF24" font-size="13" font-family="sans-serif">Point (e, 1)</text>

  <!-- Courbe de ln(x) -->
  <!-- x va de 0.08 à 7.5 :
       x=0.08: px=146, y=300 - 80*(-2.52) = 501 (hors cadre bas)
       x=0.15: px=152, y=300 - 80*(-1.897) = 451
       x=0.3:  px=164, y=300 - 80*(-1.20) = 396
       x=0.5:  px=180, y=300 - 80*(-0.693) = 355
       x=1.0:  px=220, y=300
       x=2.0:  px=300, y=300 - 80*(0.693) = 244
       x=2.718:px=357, y=220
       x=4.0:  px=460, y=300 - 80*(1.386) = 189
       x=5.5:  px=580, y=300 - 80*(1.704) = 163
       x=7.2:  px=716, y=300 - 80*(1.974) = 142
  -->
  <path d="M 148 450 C 155 380, 180 330, 220 300 C 270 262, 330 228, 400 205 C 490 178, 590 158, 720 142" 
        fill="none" stroke="url(#curveGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Tangente en x=1 : y = x - 1 (pente = 1 -> delta_y / delta_x = 1 -> -80 / +80 = -1) -->
  <line x1="160" y1="360" x2="300" y2="220" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="305" y="215" fill="#38BDF8" font-size="12" font-family="sans-serif">Tangente T₁ : y = x - 1 (pente f'(1) = 1)</text>

  <!-- Badge Formule Clé & Limites au Bac -->
  <g transform="translate(470, 250)">
    <rect width="250" height="150" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" opacity="0.95"/>
    <text x="16" y="28" fill="#00F5D4" font-size="14" font-family="sans-serif" font-weight="bold">Propriétés Clés au Bac S2</text>
    <text x="16" y="55" fill="#E2E8F0" font-size="12" font-family="sans-serif">• Domaine : x &gt; 0 (strictement positif)</text>
    <text x="16" y="78" fill="#E2E8F0" font-size="12" font-family="sans-serif">• Dérivée : (ln x)' = 1/x &gt; 0 (croissante)</text>
    <text x="16" y="101" fill="#E2E8F0" font-size="12" font-family="sans-serif">• Dérivée composite : (ln u)' = u'/u</text>
    <text x="16" y="124" fill="#FBBF24" font-size="12" font-family="sans-serif">• lim x→0⁺ ln x = -∞</text>
    <text x="16" y="142" fill="#FBBF24" font-size="12" font-family="sans-serif">• lim x→+∞ ln x = +∞</text>
  </g>

  <!-- Titre Principal -->
  <text x="30" y="36" fill="#FFFFFF" font-size="18" font-family="sans-serif" font-weight="bold">Fonction Logarithme Népérien : Courbe &amp; Allure Asymptotique</text>
</svg>

