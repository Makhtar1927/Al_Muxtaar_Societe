<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="compBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="modulusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="compGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre Navy Al Muxtaar -->
  <rect width="800" height="480" rx="16" fill="url(#compBgGrad)"/>

  <!-- Grille du plan complexe (O, u, v) -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="60" y1="60" x2="740" y2="60"/>
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="180" x2="740" y2="180"/>
    <line x1="60" y1="240" x2="740" y2="240"/>
    <line x1="60" y1="300" x2="740" y2="300"/>
    <line x1="60" y1="360" x2="740" y2="360"/>
    <line x1="60" y1="420" x2="740" y2="420"/>

    <line x1="100" y1="40" x2="100" y2="440"/>
    <line x1="180" y1="40" x2="180" y2="440"/>
    <line x1="260" y1="40" x2="260" y2="440"/>
    <line x1="340" y1="40" x2="340" y2="440"/>
    <line x1="420" y1="40" x2="420" y2="440"/>
    <line x1="500" y1="40" x2="500" y2="440"/>
    <line x1="580" y1="40" x2="580" y2="440"/>
    <line x1="660" y1="40" x2="660" y2="440"/>
  </g>

  <!-- Cercle trigonométrique unité centré en (260, 240) -->
  <circle cx="260" cy="240" r="140" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.4"/>
  <circle cx="260" cy="240" r="90" fill="none" stroke="#00F5D4" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.25"/>

  <!-- Axes du repère complexe : Origine O à (260, 240) -->
  <!-- Axe réel (Axe des abscisses) -->
  <line x1="70" y1="240" x2="450" y2="240" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="450,240 440,235 440,245" fill="#94A3B8"/>
  <text x="455" y="244" fill="#94A3B8" font-size="13" font-family="sans-serif" font-weight="bold">Re(z)</text>

  <!-- Axe imaginaire (Axe des ordonnées) -->
  <line x1="260" y1="410" x2="260" y2="70" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="260,70 255,80 265,80" fill="#94A3B8"/>
  <text x="268" y="75" fill="#94A3B8" font-size="13" font-family="sans-serif" font-weight="bold">Im(z)</text>
  <text x="245" y="258" fill="#94A3B8" font-size="14" font-family="sans-serif">O</text>

  <!-- Vecteurs de base (u, v) -->
  <line x1="260" y1="240" x2="310" y2="240" stroke="#00F5D4" stroke-width="3"/>
  <polygon points="310,240 302,236 302,244" fill="#00F5D4"/>
  <text x="282" y="234" fill="#00F5D4" font-size="12" font-family="sans-serif" font-weight="bold">u</text>

  <line x1="260" y1="240" x2="260" y2="190" stroke="#00F5D4" stroke-width="3"/>
  <polygon points="260,190 256,198 264,198" fill="#00F5D4"/>
  <text x="248" y="210" fill="#00F5D4" font-size="12" font-family="sans-serif" font-weight="bold">v</text>

  <!-- Point M(z) à angle 35° et rayon 140 -> cos(35°)=0.819 -> dx=115, sin(35°)=0.574 -> dy=-80 -->
  <!-- M = (260 + 115, 240 - 80) = (375, 160) -->
  <!-- Projections sur les axes -->
  <line x1="375" y1="160" x2="375" y2="240" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="375" y1="160" x2="260" y2="160" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="370" y="256" fill="#FBBF24" font-size="12" font-family="sans-serif" font-weight="bold">a (partie réelle)</text>
  <text x="175" y="164" fill="#FBBF24" font-size="12" font-family="sans-serif" font-weight="bold">b (partie imaginaire)</text>

  <!-- Vecteur OM : Rayon / Module |z| = r -->
  <line x1="260" y1="240" x2="375" y2="160" stroke="url(#modulusGrad)" stroke-width="3.5" filter="url(#compGlow)"/>
  <circle cx="375" cy="160" r="6" fill="#00F5D4" stroke="#FFFFFF" stroke-width="2"/>
  <text x="385" y="155" fill="#00F5D4" font-size="14" font-family="sans-serif" font-weight="bold">M(z) [Affixe z]</text>
  <text x="310" y="190" fill="#38BDF8" font-size="13" font-family="sans-serif" font-weight="bold">|z| = r</text>

  <!-- Arc de l'argument θ = arg(z) -->
  <path d="M 295 240 A 35 35 0 0 0 289 220" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
  <text x="302" y="226" fill="#F43F5E" font-size="13" font-family="sans-serif" font-weight="bold">θ</text>

  <!-- Panneau Didactique Droite : Les 3 Formes d'un Nombre Complexe -->
  <rect x="490" y="60" width="280" height="360" rx="14" fill="#0E1A38" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Titre Panneau -->
  <text x="505" y="90" fill="#00F5D4" font-size="14" font-family="sans-serif" font-weight="bold">
    LES 3 FORMES AU BAC S2
  </text>
  <line x1="505" y1="100" x2="750" y2="100" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Forme 1 : Algébrique -->
  <text x="505" y="125" fill="#FBBF24" font-size="12" font-family="sans-serif" font-weight="bold">1. Forme Algébrique</text>
  <text x="505" y="148" fill="#FFFFFF" font-size="13" font-family="monospace">z = a + i·b  (a, b ∈ ℝ)</text>
  <text x="505" y="168" fill="#94A3B8" font-size="11" font-family="sans-serif">Re(z) = a, Im(z) = b, i² = -1</text>

  <!-- Forme 2 : Trigonométrique -->
  <text x="505" y="200" fill="#FBBF24" font-size="12" font-family="sans-serif" font-weight="bold">2. Forme Trigonométrique</text>
  <text x="505" y="223" fill="#FFFFFF" font-size="13" font-family="monospace">z = r(cos θ + i·sin θ)</text>
  <text x="505" y="243" fill="#94A3B8" font-size="11" font-family="sans-serif">r = |z| = √(a² + b²) &gt; 0</text>
  <text x="505" y="260" fill="#94A3B8" font-size="11" font-family="sans-serif">cos θ = a/r,  sin θ = b/r</text>

  <!-- Forme 3 : Exponentielle -->
  <text x="505" y="292" fill="#FBBF24" font-size="12" font-family="sans-serif" font-weight="bold">3. Forme Exponentielle (Euler)</text>
  <text x="505" y="315" fill="#FFFFFF" font-size="14" font-family="monospace">z = r · e^(iθ)</text>
  <text x="505" y="335" fill="#94A3B8" font-size="11" font-family="sans-serif">Formule de Moivre : (e^(iθ))^n = e^(inθ)</text>
  <text x="505" y="352" fill="#94A3B8" font-size="11" font-family="sans-serif">Formules d'Euler : cos θ = (e^iθ + e^-iθ)/2</text>

  <!-- Badge géométrie -->
  <rect x="505" y="375" width="250" height="32" rx="8" fill="#14213d" stroke="#00F5D4" stroke-width="1"/>
  <text x="515" y="396" fill="#00F5D4" font-size="11" font-family="sans-serif" font-weight="bold">
    Géométrie : Distance AB = |z_B - z_A|
  </text>

  <!-- Titre Principal Général -->
  <rect x="70" y="20" width="390" height="36" rx="8" fill="#14213d" stroke="#00F5D4" stroke-width="1"/>
  <text x="85" y="43" fill="#FFFFFF" font-size="13" font-family="sans-serif" font-weight="bold">
    📐 Le Plan Complexe d'Argand-Cauchy (Terminale S2)
  </text>
</svg>

