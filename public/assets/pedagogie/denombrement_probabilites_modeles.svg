<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="probBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <filter id="probGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre Navy Al Muxtaar -->
  <rect width="800" height="480" rx="16" fill="url(#probBgGrad)"/>

  <!-- Titre Principal -->
  <rect x="50" y="20" width="460" height="38" rx="8" fill="#14213d" stroke="#00F5D4" stroke-width="1"/>
  <text x="65" y="44" fill="#FFFFFF" font-size="13" font-family="sans-serif" font-weight="bold">
    🎲 Dénombrement &amp; Tirages au Sort au Bac S2 (Les 3 Modèles)
  </text>

  <!-- Colonne 1 : Tirage Simultané (Combinaisons C_n^p) -->
  <rect x="50" y="75" width="220" height="235" rx="12" fill="#0E1A38" stroke="#00F5D4" stroke-width="1.5"/>
  <rect x="50" y="75" width="220" height="36" rx="12" fill="#00F5D4" fill-opacity="0.15"/>
  <text x="65" y="99" fill="#00F5D4" font-size="13" font-family="sans-serif" font-weight="bold">Tirage Simultané</text>
  
  <text x="65" y="132" fill="#FBBF24" font-size="12" font-family="sans-serif" font-weight="bold">MOTS CLÉS :</text>
  <text x="65" y="152" fill="#E2E8F0" font-size="11" font-family="sans-serif">« Tirer simultanément p boules »</text>
  <text x="65" y="170" fill="#E2E8F0" font-size="11" font-family="sans-serif">« Au hasard et en même temps »</text>
  <text x="65" y="188" fill="#94A3B8" font-size="11" font-family="sans-serif">Pas d&apos;ordre • Sans remise</text>

  <rect x="65" y="205" width="190" height="48" rx="8" fill="#1C2541"/>
  <text x="75" y="226" fill="#00F5D4" font-size="14" font-family="monospace" font-weight="bold">C_n^p = n! / (p!(n-p)!)</text>
  <text x="75" y="244" fill="#94A3B8" font-size="10" font-family="sans-serif">Ex: Mains de cartes, comités</text>

  <!-- Colonne 2 : Tirage Successif SANS Remise (Arrangements A_n^p) -->
  <rect x="290" y="75" width="220" height="235" rx="12" fill="#0E1A38" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="290" y="75" width="220" height="36" rx="12" fill="#38BDF8" fill-opacity="0.15"/>
  <text x="305" y="99" fill="#38BDF8" font-size="13" font-family="sans-serif" font-weight="bold">Successif SANS Remise</text>
  
  <text x="305" y="132" fill="#FBBF24" font-size="12" font-family="sans-serif" font-weight="bold">MOTS CLÉS :</text>
  <text x="305" y="152" fill="#E2E8F0" font-size="11" font-family="sans-serif">« Tirer successivement sans remise »</text>
  <text x="305" y="170" fill="#E2E8F0" font-size="11" font-family="sans-serif">« L&apos;une après l&apos;autre sans la remettre »</text>
  <text x="305" y="188" fill="#94A3B8" font-size="11" font-family="sans-serif">ORDRE COMPTE • Sans répétition</text>

  <rect x="305" y="205" width="190" height="48" rx="8" fill="#1C2541"/>
  <text x="315" y="226" fill="#38BDF8" font-size="14" font-family="monospace" font-weight="bold">A_n^p = n! / (n - p)!</text>
  <text x="315" y="244" fill="#94A3B8" font-size="10" font-family="sans-serif">Ex: Podiums, bureaux ordonnés</text>

  <!-- Colonne 3 : Tirage Successif AVEC Remise (P-listes n^p) -->
  <rect x="530" y="75" width="220" height="235" rx="12" fill="#0E1A38" stroke="#FBBF24" stroke-width="1.5"/>
  <rect x="530" y="75" width="220" height="36" rx="12" fill="#FBBF24" fill-opacity="0.15"/>
  <text x="545" y="99" fill="#FBBF24" font-size="13" font-family="sans-serif" font-weight="bold">Successif AVEC Remise</text>
  
  <text x="545" y="132" fill="#00F5D4" font-size="12" font-family="sans-serif" font-weight="bold">MOTS CLÉS :</text>
  <text x="545" y="152" fill="#E2E8F0" font-size="11" font-family="sans-serif">« Tirer successivement avec remise »</text>
  <text x="545" y="170" fill="#E2E8F0" font-size="11" font-family="sans-serif">« On note et on remet dans l&apos;urne »</text>
  <text x="545" y="188" fill="#94A3B8" font-size="11" font-family="sans-serif">ORDRE COMPTE • Répétition permise</text>

  <rect x="545" y="205" width="190" height="48" rx="8" fill="#1C2541"/>
  <text x="555" y="226" fill="#FBBF24" font-size="14" font-family="monospace" font-weight="bold">Nombre = n^p</text>
  <text x="555" y="244" fill="#94A3B8" font-size="10" font-family="sans-serif">Ex: Codes secrets, lancers répétés</text>

  <!-- Section Inférieure : Arbre Pondéré & Formule des Probabilités Totales -->
  <rect x="50" y="325" width="700" height="135" rx="12" fill="#0E1A38" stroke="#F43F5E" stroke-width="1.5"/>
  
  <!-- En-tête de section inférieure -->
  <text x="70" y="352" fill="#F43F5E" font-size="13" font-family="sans-serif" font-weight="bold">
    🌳 Probabilités Conditionnelles &amp; Formule des Probabilités Totales (Partition de l&apos;univers)
  </text>

  <!-- Représentation schéma arbre miniature -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="75" y1="400" x2="140" y2="375"/>
    <line x1="75" y1="400" x2="140" y2="425"/>
    <line x1="165" y1="375" x2="225" y2="365"/>
    <line x1="165" y1="375" x2="225" y2="385"/>
  </g>
  <circle cx="75" cy="400" r="4" fill="#00F5D4"/>
  <text x="145" y="380" fill="#00F5D4" font-size="12" font-family="sans-serif" font-weight="bold">B</text>
  <text x="145" y="430" fill="#94A3B8" font-size="12" font-family="sans-serif" font-weight="bold">B̄</text>
  <text x="230" y="370" fill="#38BDF8" font-size="11" font-family="sans-serif">A</text>
  <text x="230" y="390" fill="#94A3B8" font-size="11" font-family="sans-serif">Ā</text>

  <!-- Formule des probabilités totales encadrée -->
  <rect x="290" y="365" width="440" height="80" rx="8" fill="#14213d" stroke="#38BDF8" stroke-width="1"/>
  <text x="305" y="390" fill="#38BDF8" font-size="12" font-family="sans-serif" font-weight="bold">
    Probabilités Totales : P(A) = P(A ∩ B) + P(A ∩ B̄) = P(B)·P_B(A) + P(B̄)·P_B̄(A)
  </text>
  <text x="305" y="415" fill="#E2E8F0" font-size="12" font-family="sans-serif">
    Loi Binomiale B(n, p) : P(X = k) = C_n^k · p^k · (1 - p)^(n - k)
  </text>
  <text x="305" y="435" fill="#FBBF24" font-size="11" font-family="sans-serif" font-weight="bold">
    Espérance : E(X) = n · p   |   Variance : V(X) = n · p · (1 - p)
  </text>
</svg>

