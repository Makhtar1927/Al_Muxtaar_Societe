<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre Navy Al Muxtaar -->
  <rect width="800" height="540" rx="16" fill="url(#skyGrad)"/>

  <!-- Titre & Bandeau Pédagogique -->
  <rect x="40" y="18" width="720" height="36" rx="8" fill="#14213D" stroke="#00F5D4" stroke-width="1"/>
  <text x="400" y="41" fill="#FFFFFF" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    🚖 Métaphore Concrète au Sénégal : La Limite = Le Ralentissement au Péage
  </text>

  <!-- Route / Autoroute à péage (Dakar - Diamniadio) -->
  <rect x="40" y="70" width="720" height="170" rx="14" fill="url(#roadGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Lignes de circulation blanches en pointillés -->
  <line x1="40" y1="155" x2="760" y2="155" stroke="#FFFFFF" stroke-dasharray="25 20" stroke-width="3" opacity="0.6"/>

  <!-- Barrière de péage / Ligne d'arrêt cible x0 -->
  <line x1="560" y1="70" x2="560" y2="240" stroke="#F43F5E" stroke-width="4" stroke-dasharray="6 4"/>
  <rect x="548" y="75" width="24" height="20" rx="4" fill="#F43F5E"/>
  <text x="560" y="89" fill="#FFFFFF" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">STOP</text>
  
  <text x="560" y="260" fill="#F43F5E" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    Position Cible x₀ (La Barrière)
  </text>
  <text x="560" y="278" fill="#94A3B8" font-size="10" font-family="sans-serif" text-anchor="middle">
    Vitesse / Compteur converge vers L = 0 km/h
  </text>

  <!-- Voiture / Car Rapide venant de la gauche : x -> x0^- (par valeurs inférieures) -->
  <g transform="translate(260, 105)">
    <!-- Carrosserie Car Rapide jaune & bleue -->
    <rect x="0" y="10" width="110" height="42" rx="8" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
    <rect x="0" y="28" width="110" height="10" fill="#0284C7"/>
    <!-- Fenêtres -->
    <rect x="15" y="14" width="22" height="12" rx="2" fill="#0F172A"/>
    <rect x="45" y="14" width="22" height="12" rx="2" fill="#0F172A"/>
    <rect x="75" y="14" width="22" height="12" rx="2" fill="#0F172A"/>
    <!-- Roues -->
    <circle cx="28" cy="52" r="10" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="82" cy="52" r="10" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Phares avec lueur -->
    <polygon points="110,22 170,10 170,40" fill="#FEF08A" opacity="0.25"/>
    <text x="55" y="36" fill="#FFFFFF" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">AL MUXTAAR</text>
  </g>

  <!-- Flèche d'approche à gauche -->
  <g transform="translate(385, 140)">
    <line x1="0" y1="0" x2="135" y2="0" stroke="#00F5D4" stroke-width="3"/>
    <polygon points="140,0 128,-5 128,5" fill="#00F5D4"/>
    <text x="65" y="-8" fill="#00F5D4" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">
      x → x₀⁻ (À gauche)
    </text>
  </g>

  <!-- =========================================================== -->
  <!-- Explication Pédagogique & Décodage Wolof — section corrigée -->
  <!-- Rect plus grand: y=295, height=230 → bottom = 525           -->
  <!-- =========================================================== -->
  <rect x="40" y="295" width="720" height="230" rx="12" fill="#0E1A38" stroke="#38BDF8" stroke-width="1.2"/>

  <!-- Titre de la section -->
  <text x="60" y="322" fill="#00F5D4" font-size="12" font-family="sans-serif" font-weight="bold">
    🎯 CE QU&apos;IL FAUT RETENIR (EN FRANÇAIS &amp; EN WOLOF) :
  </text>

  <!-- Français : label -->
  <text x="60" y="348" font-family="sans-serif" font-size="11">
    <tspan fill="#E2E8F0">• </tspan><tspan font-weight="bold" fill="#FBBF24">Français :</tspan>
  </text>
  <!-- Français : ligne 1 -->
  <text x="72" y="365" fill="#E2E8F0" font-size="11" font-family="sans-serif">
    Calculer une limite quand x tend vers x₀, ce n&apos;est pas regarder ce qui se passe
  </text>
  <!-- Français : ligne 2 -->
  <text x="72" y="380" fill="#E2E8F0" font-size="11" font-family="sans-serif">
    sur la barrière, mais observer comment le véhicule s&apos;en rapproche
  </text>
  <!-- Français : ligne 3 -->
  <text x="72" y="395" fill="#E2E8F0" font-size="11" font-family="sans-serif">
    infiniment — sans forcément la toucher.
  </text>

  <!-- Wolof : label -->
  <text x="60" y="420" font-family="sans-serif" font-size="11">
    <tspan fill="#E2E8F0">• </tspan><tspan font-weight="bold" fill="#38BDF8">Wolof :</tspan>
  </text>
  <!-- Wolof : ligne 1 -->
  <text x="72" y="437" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    « Limite mooy fu jëm : booy jegeñsi barrière bi (x₀) te do ko dal,
  </text>
  <!-- Wolof : ligne 2 -->
  <text x="72" y="452" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    viteesu oto bi (f(x)) day waajal a taxaw ci L.
  </text>
  <!-- Wolof : ligne 3 -->
  <text x="72" y="467" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    Mën nga jegeñsi ci wetu cammooñ (x₀⁻) walla ci wetu ndeyjoor (x₀⁺) ! »
  </text>

  <!-- Note finale -->
  <text x="60" y="496" fill="#94A3B8" font-size="10" font-family="sans-serif">
    Si la limite à gauche = la limite à droite = L, alors la limite existe et vaut exactement L.
  </text>
</svg>
