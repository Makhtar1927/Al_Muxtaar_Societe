<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="skyInt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glowGoldInt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre Navy Al Muxtaar -->
  <rect width="800" height="540" rx="16" fill="url(#skyInt)"/>

  <!-- Titre & Bandeau Pédagogique -->
  <rect x="40" y="18" width="720" height="38" rx="8" fill="#14213D" stroke="#00F5D4" stroke-width="1"/>
  <text x="400" y="42" fill="#FFFFFF" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    🌾 Métaphore Concrète au Sénégal : L&apos;Intégration = L&apos;Aire d&apos;un Champ &amp; La Priorité ALPES
  </text>

  <!-- Panneau Gauche : Aire sous la Courbe (Le Champ Agricole) -->
  <g transform="translate(40, 70)">
    <rect width="345" height="235" rx="12" fill="#0A0F1D" stroke="#334155" stroke-width="1.5"/>
    <text x="172" y="24" fill="#00F5D4" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">
      1. Intégrale Définie = Aire sous la Courbe
    </text>

    <!-- Axes Ox et Oy -->
    <line x1="30" y1="180" x2="315" y2="180" stroke="#64748B" stroke-width="1.5"/>
    <line x1="45" y1="40" x2="45" y2="180" stroke="#64748B" stroke-width="1.5"/>

    <!-- Courbe continue f(x) >= 0 -->
    <path d="M 60 150 Q 120 70 180 85 T 300 130" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <text x="290" y="115" fill="#38BDF8" font-size="9" font-family="sans-serif" font-weight="bold">y = f(x)</text>

    <!-- Zone hachurée / colorée de a à b -->
    <!-- a = 100, b = 240 -->
    <path d="M 100 180 L 100 102 Q 120 70 180 85 Q 210 95 240 108 L 240 180 Z" 
          fill="url(#fieldGrad)" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Bornes a et b -->
    <circle cx="100" cy="180" r="3.5" fill="#FBBF24"/>
    <text x="100" y="195" fill="#FDE047" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">x = a</text>
    <circle cx="240" cy="180" r="3.5" fill="#FBBF24"/>
    <text x="240" y="195" fill="#FDE047" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">x = b</text>

    <!-- Label Aire au centre -->
    <rect x="130" y="125" width="80" height="22" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="170" y="140" fill="#6EE7B7" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">
      Aire = ∫ₐᵇ f(x)dx
    </text>

    <!-- Mini-résumé unité en cm² -->
    <rect x="25" y="200" width="295" height="26" rx="5" fill="#14213D" stroke="#00F5D4" stroke-width="0.8"/>
    <text x="172" y="217" fill="#E2E8F0" font-size="8.5" font-family="sans-serif" text-anchor="middle">
      Conversion : Aire en cm² = (Valeur ∫) × (ǁiǁ × ǁjǁ cm²)
    </text>
  </g>

  <!-- Panneau Droit : L'IPP & La Règle Mnémotechnique ALPES -->
  <g transform="translate(415, 70)">
    <rect width="345" height="235" rx="12" fill="#0A0F1D" stroke="#334155" stroke-width="1.5"/>
    <text x="172" y="24" fill="#FBBF24" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">
      2. Intégration Par Parties : Ordre ALPES
    </text>

    <!-- Les 5 marches ALPES -->
    <g transform="translate(35, 45)">
      <!-- A -->
      <rect x="0" y="0" width="275" height="24" rx="4" fill="#14213D" stroke="#475569" stroke-width="1"/>
      <text x="15" y="16" fill="#F43F5E" font-size="10" font-family="sans-serif" font-weight="black">A</text>
      <text x="35" y="16" fill="#E2E8F0" font-size="9" font-family="sans-serif">Arc (Fonctions réciproques)</text>
      
      <!-- L -->
      <rect x="0" y="28" width="275" height="24" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="15" y="44" fill="#38BDF8" font-size="10" font-family="sans-serif" font-weight="black">L</text>
      <text x="35" y="44" fill="#38BDF8" font-size="9" font-family="sans-serif" font-weight="bold">Logarithme (ln x) ⟹ TOUJOURS à dériver !</text>

      <!-- P -->
      <rect x="0" y="56" width="275" height="24" rx="4" fill="#14213D" stroke="#FBBF24" stroke-width="1"/>
      <text x="15" y="72" fill="#FBBF24" font-size="10" font-family="sans-serif" font-weight="black">P</text>
      <text x="35" y="72" fill="#E2E8F0" font-size="9" font-family="sans-serif">Polynôme (x, x², xⁿ ⟹ Baisse de degré)</text>

      <!-- E -->
      <rect x="0" y="84" width="275" height="24" rx="4" fill="#14213D" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="100" fill="#10B981" font-size="10" font-family="sans-serif" font-weight="black">E</text>
      <text x="35" y="100" fill="#E2E8F0" font-size="9" font-family="sans-serif">Exponentielle (eˣ ⟹ Très facile à primitiver)</text>

      <!-- S -->
      <rect x="0" y="112" width="275" height="24" rx="4" fill="#14213D" stroke="#475569" stroke-width="1"/>
      <text x="15" y="128" fill="#94A3B8" font-size="10" font-family="sans-serif" font-weight="black">S</text>
      <text x="35" y="128" fill="#E2E8F0" font-size="9" font-family="sans-serif">Sinus &amp; Cosinus</text>
    </g>

    <!-- Formule IPP -->
    <rect x="25" y="190" width="295" height="32" rx="6" fill="#14213D" stroke="#FBBF24" stroke-width="0.8"/>
    <text x="172" y="210" fill="#FDE047" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">
      ∫ u&apos;v = [u · v] - ∫ u · v&apos;   (v = premier dans ALPES)
    </text>
  </g>

  <!-- =========================================================== -->
  <!-- Explication Pédagogique & Décodage Wolof                    -->
  <!-- =========================================================== -->
  <rect x="40" y="320" width="720" height="205" rx="12" fill="#0E1A38" stroke="#38BDF8" stroke-width="1.2"/>

  <!-- Titre -->
  <text x="60" y="344" fill="#00F5D4" font-size="12" font-family="sans-serif" font-weight="bold">
    🎯 CE QU&apos;IL FAUT RETENIR (EN FRANÇAIS &amp; EN WOLOF) :
  </text>

  <!-- Français : label + lignes courtes -->
  <text x="60" y="367" font-family="sans-serif" font-size="11">
    <tspan fill="#E2E8F0">• </tspan><tspan font-weight="bold" fill="#FBBF24">Français :</tspan>
  </text>
  <text x="72" y="383" fill="#E2E8F0" font-size="11" font-family="sans-serif">
    L&apos;intégrale mesure la surface exacte sous la courbe f(x) ≥ 0 : ∫ₐᵇ f(x)dx = F(b) - F(a).
  </text>
  <text x="72" y="398" fill="#E2E8F0" font-size="11" font-family="sans-serif">
    Pour l&apos;IPP, la règle ALPES désigne en premier la fonction à dériver : ln x passe avant x, qui passe avant eˣ.
  </text>
  <text x="72" y="413" fill="#94A3B8" font-size="10" font-family="sans-serif">
    Attention au piège de l&apos;unité : toujours multiplier l&apos;intégrale par (ǁiǁ × ǁjǁ) cm² !
  </text>

  <!-- Wolof : label + lignes courtes -->
  <text x="60" y="438" font-family="sans-serif" font-size="11">
    <tspan fill="#E2E8F0">• </tspan><tspan font-weight="bold" fill="#38BDF8">Wolof :</tspan>
  </text>
  <text x="72" y="454" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    « Intégrale dafay natt yaatuwaayu tool bi (aire) nekk ci suuf courbe bi : F(b) - F(a).
  </text>
  <text x="72" y="469" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    Ci IPP, ALPES moo lay jox ordre bi : Logarithme (L) moo jëkk Polynôme (P), Polynôme moo jëkk Exponentielle (E).
  </text>
  <text x="72" y="484" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    Ki jëkk ci ALPES mooy ki ngay dériver ci calcul bi ! Te bu la fatte faf résultat bi ak (ǁiǁ × ǁjǁ) cm² ! »
  </text>

  <!-- Réflexe Bac S2 -->
  <text x="60" y="511" fill="#38BDF8" font-size="10" font-family="sans-serif" font-weight="bold">
    ⚡ Réflexe Bac S2 : Aire = ∫ (f(x) - g(x))dx • IPP = ALPES • Aire réelle = Intégrale × ǁiǁ × ǁjǁ cm².
  </text>
</svg>

