<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="url(#bgGrad)" rx="16"/>

  <!-- Top Title Banner -->
  <rect x="40" y="16" width="720" height="38" rx="8" fill="#1E293B" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="400" y="41" fill="#00F5D4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    MÉTAPHORE CONCRÈTE AU SÉNÉGAL : LE PLAN D'ARGAND = CARTE MARINE AU LARGE DE DAKAR
  </text>

  <!-- LEFT PANEL: Carte Marine & Coordonnées -->
  <rect x="40" y="66" width="345" height="240" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.2"/>
  <text x="212" y="90" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    1. Plan d'Argand = Carte de Navigation (Gorée / Port)
  </text>

  <!-- Radar / Navigation Circles -->
  <circle cx="212" cy="180" r="85" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="212" cy="180" r="55" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="212" cy="180" r="25" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Axes: Re(z) et Im(z) -->
  <line x1="110" y1="180" x2="315" y2="180" stroke="#64748B" stroke-width="1.5"/>
  <line x1="212" y1="275" x2="212" y2="95" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="317,180 310,176 310,184" fill="#64748B"/>
  <polygon points="212,93 208,100 216,100" fill="#64748B"/>

  <text x="315" y="196" fill="#94A3B8" font-size="10" font-weight="bold">Re (Est)</text>
  <text x="216" y="106" fill="#94A3B8" font-size="10" font-weight="bold">Im (Nord)</text>

  <!-- Point O (Port de Dakar) -->
  <circle cx="212" cy="180" r="4" fill="#FBBF24"/>
  <text x="198" y="195" fill="#FBBF24" font-size="10" font-weight="bold">O (Port)</text>

  <!-- Point M(z) Pirogue en mer -->
  <!-- Vecteur OM -->
  <line x1="212" y1="180" x2="272" y2="120" stroke="#00F5D4" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="272" cy="120" r="5" fill="#00F5D4" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="282" y="118" fill="#00F5D4" font-size="11" font-weight="bold">M(z = a + ib)</text>

  <!-- Projections a et b -->
  <line x1="272" y1="120" x2="272" y2="180" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="272" y1="120" x2="212" y2="120" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="270" y="194" fill="#38BDF8" font-size="9" text-anchor="middle">a (Re)</text>
  <text x="195" y="124" fill="#38BDF8" font-size="9" text-anchor="end">b (Im)</text>

  <!-- Arc Angle theta -->
  <path d="M 237 180 A 25 25 0 0 0 230 162" fill="none" stroke="#F43F5E" stroke-width="2"/>
  <text x="245" y="168" fill="#F43F5E" font-size="10" font-weight="bold">θ (Cap)</text>

  <!-- Label distance r -->
  <text x="233" y="142" fill="#FDE047" font-size="10" font-weight="bold">r = |z|</text>
  <text x="212" y="295" fill="#CBD5E1" font-size="9.5" text-anchor="middle">
    Module r = distance au port | Argument θ = direction de la boussole
  </text>

  <!-- RIGHT PANEL: Forme Trigonométrique et Moivre -->
  <rect x="415" y="66" width="345" height="240" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.2"/>
  <text x="587" y="90" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    2. Forme Trigonométrique &amp; Formule de Moivre
  </text>

  <!-- Mini Compass Rose -->
  <g transform="translate(587, 175)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Compass points -->
    <polygon points="0,-60 6,-18 0,0" fill="#EF4444"/>
    <polygon points="0,-60 -6,-18 0,0" fill="#DC2626"/>
    <polygon points="0,60 6,18 0,0" fill="#94A3B8"/>
    <polygon points="0,60 -6,18 0,0" fill="#64748B"/>
    <polygon points="60,0 18,6 0,0" fill="#94A3B8"/>
    <polygon points="60,0 18,-6 0,0" fill="#64748B"/>
    <polygon points="-60,0 -18,6 0,0" fill="#94A3B8"/>
    <polygon points="-60,0 -18,-6 0,0" fill="#64748B"/>
    <text x="0" y="-68" fill="#EF4444" font-size="10" font-weight="bold" text-anchor="middle">N (i)</text>
    <text x="73" y="4" fill="#94A3B8" font-size="10" font-weight="bold" text-anchor="middle">+1</text>
    <text x="-73" y="4" fill="#94A3B8" font-size="10" font-weight="bold" text-anchor="middle">-1</text>
    <text x="0" y="76" fill="#94A3B8" font-size="10" font-weight="bold" text-anchor="middle">-i</text>
  </g>

  <!-- Encadré Formule Moivre -->
  <rect x="430" y="248" width="315" height="48" rx="6" fill="#0B132B" stroke="#00F5D4" stroke-width="1"/>
  <text x="587" y="267" fill="#00F5D4" font-size="10.5" font-weight="bold" text-anchor="middle">
    Formule de Moivre : (r · e^(iθ))^n = r^n · e^(i · nθ)
  </text>
  <text x="587" y="284" fill="#E2E8F0" font-size="9" text-anchor="middle">
    La distance est élevée à la puissance n, l'angle de cap est multiplié par n !
  </text>

  <!-- BOTTOM PANEL: Explication complète Français + Wolof (lignes courtes < 85 car.) -->
  <rect x="40" y="320" width="720" height="205" rx="12" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2"/>

  <!-- En-tête du bas -->
  <rect x="55" y="330" width="690" height="24" rx="5" fill="#1E293B"/>
  <text x="70" y="346" fill="#38BDF8" font-size="11" font-weight="bold">
    🇸🇳 DÉCRYPTAGE BAC S2 &amp; VIE COURANTE : LE PLAN COMPLEXE DÉMYSTIFIÉ
  </text>

  <!-- Texte Français (Lignes scindées) -->
  <text x="60" y="372" fill="#E2E8F0" font-size="10" font-weight="bold">
    En Français :
  </text>
  <text x="135" y="372" fill="#E2E8F0" font-size="10">
    Un nombre complexe z = a + ib n'est pas abstrait : c'est la position d'un navire en mer.
  </text>
  <text x="60" y="388" fill="#E2E8F0" font-size="10">
    • Sa partie réelle a mesure la distance Est-Ouest, sa partie imaginaire b mesure la distance Nord-Sud.
  </text>
  <text x="60" y="404" fill="#E2E8F0" font-size="10">
    • Le module |z| = √(a² + b²) donne la distance exacte en ligne droite jusqu'au Port de Dakar (l'origine O).
  </text>
  <text x="60" y="420" fill="#E2E8F0" font-size="10">
    • L'argument θ = arg(z) donne le cap précis sur la boussole (en radians ou degrés).
  </text>

  <!-- Séparateur -->
  <line x1="60" y1="432" x2="740" y2="432" stroke="#334155" stroke-width="1"/>

  <!-- Texte Wolof (Lignes scindées) -->
  <text x="60" y="450" fill="#FBBF24" font-size="10" font-weight="bold">
    Ci Wolof (Xam-xam) :
  </text>
  <text x="180" y="450" fill="#FDE047" font-size="9.5" font-style="italic">
    « Nimero complexe z = a + ib dafa am ñaari fànn yu am solo :
  </text>
  <text x="60" y="468" fill="#FDE047" font-size="9.5" font-style="italic">
    - Module |z| mooy soréwaayu gaal gi ak por Dakar (distance directe ci kaw ndox mi).
  </text>
  <text x="60" y="484" fill="#FDE047" font-size="9.5" font-style="italic">
    - Argument arg(z) mooy fànn bi boussole bi jëm (cap de navigation bi ngay topp).
  </text>
  <text x="60" y="500" fill="#FDE047" font-size="9.5" font-style="italic">
    - Formule de Moivre dafay wax : boo boolee n yoon, soréwaay bi day yokk (r^n), te boussole bi day wër (n·θ) ! »
  </text>
</svg>