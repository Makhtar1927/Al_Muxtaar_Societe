<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0F172A; font-family:system-ui, -apple-system, sans-serif;">
  <rect width="900" height="480" fill="#0B132B" rx="16"/>
  <rect x="2" y="2" width="896" height="476" fill="none" stroke="#334155" stroke-width="1.5" rx="14"/>
  
  <!-- Header Title -->
  <g transform="translate(450, 32)" text-anchor="middle">
    <rect x="-310" y="-16" width="620" height="32" rx="16" fill="#1E293B" stroke="#00B8A9" stroke-width="1.5"/>
    <text y="5" fill="#5EEAD4" font-size="13" font-weight="800" letter-spacing="1">P1 : CINÉMATIQUE DU POINT MATÉRIEL, BASE DE FRENET &amp; ÉQUATIONS HORAIRES</text>
  </g>

  <!-- Left: Trajectoire, Vecteur Position & Vecteur Vitesse -->
  <g transform="translate(30, 75)">
    <rect width="270" height="375" fill="#1E293B" rx="12" stroke="#334155" stroke-width="1"/>
    <text x="15" y="30" fill="#E2E8F0" font-size="13" font-weight="700">1. Position &amp; Vitesse Tangente</text>
    <text x="15" y="48" fill="#94A3B8" font-size="10">Repère cartésien (O, i⃗, j⃗) &amp; Trajectoire</text>

    <!-- Canvas SVG Graph -->
    <g transform="translate(20, 65)">
      <rect width="230" height="195" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>

      <!-- Axes cartésiens Ox and Oy -->
      <line x1="25" y1="170" x2="215" y2="170" stroke="#64748B" stroke-width="1.5"/>
      <polygon points="215,167 222,170 215,173" fill="#64748B"/>
      <text x="220" y="184" fill="#94A3B8" font-size="9" font-weight="bold">x</text>

      <line x1="35" y1="180" x2="35" y2="20" stroke="#64748B" stroke-width="1.5"/>
      <polygon points="32,20 35,13 38,20" fill="#64748B"/>
      <text x="24" y="22" fill="#94A3B8" font-size="9" font-weight="bold">y</text>
      <text x="25" y="182" fill="#64748B" font-size="9" font-weight="bold">O</text>

      <!-- Trajectoire parabolique / courbe -->
      <path d="M 45 150 Q 110 30, 195 120" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 2"/>
      <text x="180" y="55" fill="#38BDF8" font-size="9" font-style="italic">Trajectoire (C)</text>

      <!-- Point M sur la trajectoire -->
      <circle cx="115" cy="72" r="5" fill="#F8FAFC"/>
      <text x="112" y="62" fill="#F8FAFC" font-size="11" font-weight="bold">M(t)</text>

      <!-- Vecteur Position OM -->
      <line x1="35" y1="170" x2="115" y2="72" stroke="#A78BFA" stroke-width="2"/>
      <!-- Arrowhead OM -->
      <polygon points="110,75 115,72 113,80" fill="#A78BFA"/>
      <text x="65" y="115" fill="#C4B5FD" font-size="10" font-weight="bold">OM⃗</text>

      <!-- Vecteur Vitesse v tangent à la trajectoire -->
      <line x1="115" y1="72" x2="175" y2="84" stroke="#00B8A9" stroke-width="3"/>
      <polygon points="175,80 183,86 174,89" fill="#00B8A9"/>
      <text x="175" y="78" fill="#5EEAD4" font-size="11" font-weight="800">v⃗</text>

      <!-- Vecteur Accélération a tourné vers la concavité -->
      <line x1="115" y1="72" x2="135" y2="135" stroke="#F43F5E" stroke-width="2.5"/>
      <polygon points="131,133 137,141 138,131" fill="#F43F5E"/>
      <text x="142" y="132" fill="#FDA4AF" font-size="11" font-weight="800">a⃗</text>
    </g>

    <!-- Formulas card -->
    <rect x="12" y="270" width="246" height="90" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="22" y="290" fill="#38BDF8" font-size="10.5" font-weight="bold">Vecteurs Fondamentaux :</text>
    <text x="22" y="310" fill="#CBD5E1" font-size="9.5">• OM⃗(t) = x(t) i⃗ + y(t) j⃗</text>
    <text x="22" y="327" fill="#5EEAD4" font-size="9.5" font-weight="bold">• v⃗ = dOM⃗/dt = ẋ i⃗ + ẏ j⃗  (Tangent)</text>
    <text x="22" y="344" fill="#FDA4AF" font-size="9.5" font-weight="bold">• a⃗ = dv⃗/dt = ẍ i⃗ + ÿ j⃗  (Vers concavité)</text>
  </g>

  <!-- Middle: Base de Frenet (at, an) & Rayon de Courbure ρ -->
  <g transform="translate(315, 75)">
    <rect width="270" height="375" fill="#1E293B" rx="12" stroke="#334155" stroke-width="1"/>
    <text x="15" y="30" fill="#E2E8F0" font-size="13" font-weight="700">2. Base de Frenet (M, u⃗ₜ, u⃗ₙ)</text>
    <text x="15" y="48" fill="#94A3B8" font-size="10">Décomposition intrinsèque de l'accélération</text>

    <!-- Canvas SVG Frenet schema -->
    <g transform="translate(20, 65)">
      <rect width="230" height="195" rx="8" fill="#0F172A" stroke="#00B8A9" stroke-width="1.5"/>

      <!-- Cercle osculateur (concavité) -->
      <circle cx="115" cy="190" r="105" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="115" cy="190" r="3" fill="#F59E0B"/>
      <text x="115" y="202" fill="#FBBF24" font-size="8" font-weight="bold" text-anchor="middle">Centre C</text>

      <!-- Rayon de courbure ρ -->
      <line x1="115" y1="190" x2="115" y2="85" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="122" y="145" fill="#FBBF24" font-size="10" font-weight="bold">ρ</text>

      <!-- Trajectoire arc -->
      <path d="M 30 115 Q 115 50, 200 115" fill="none" stroke="#38BDF8" stroke-width="3"/>

      <!-- Mobile M -->
      <circle cx="115" cy="85" r="5" fill="#FFFFFF"/>
      <text x="105" y="75" fill="#FFFFFF" font-size="11" font-weight="bold">M</text>

      <!-- Vecteur tangentiel ut -->
      <line x1="115" y1="85" x2="175" y2="85" stroke="#38BDF8" stroke-width="2.5"/>
      <polygon points="175,82 183,85 175,88" fill="#38BDF8"/>
      <text x="185" y="88" fill="#38BDF8" font-size="11" font-weight="bold">u⃗ₜ</text>

      <!-- Vecteur normal un (centripète) -->
      <line x1="115" y1="85" x2="115" y2="135" stroke="#F43F5E" stroke-width="2.5"/>
      <polygon points="112,135 115,143 118,135" fill="#F43F5E"/>
      <text x="122" y="138" fill="#F43F5E" font-size="11" font-weight="bold">u⃗ₙ</text>

      <!-- Composantes accélération -->
      <!-- at -->
      <line x1="115" y1="85" x2="155" y2="85" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 1"/>
      <text x="145" y="75" fill="#FCD34D" font-size="9" font-weight="bold">aₜ</text>

      <!-- an -->
      <line x1="115" y1="85" x2="115" y2="125" stroke="#F43F5E" stroke-width="2" stroke-dasharray="2 1"/>
      <text x="98" y="115" fill="#FDA4AF" font-size="9" font-weight="bold">aₙ</text>

      <!-- Vecteur total a -->
      <line x1="115" y1="85" x2="155" y2="125" stroke="#A855F7" stroke-width="3"/>
      <polygon points="152,122 159,129 157,119" fill="#A855F7"/>
      <text x="165" y="132" fill="#D8B4FE" font-size="11" font-weight="bold">a⃗</text>
    </g>

    <!-- Frenet Formulas card -->
    <rect x="12" y="270" width="246" height="90" rx="8" fill="#0F172A" stroke="#00B8A9" stroke-width="1"/>
    <text x="22" y="288" fill="#5EEAD4" font-size="10.5" font-weight="bold">Accélération de Frenet :</text>
    <text x="22" y="306" fill="#FCD34D" font-size="9.5">★ aₜ = dv/dt (Variation de la vitesse)</text>
    <text x="22" y="323" fill="#FDA4AF" font-size="9.5">★ aₙ = v² / ρ (Courbure &amp; Centripète)</text>
    <text x="22" y="342" fill="#F8FAFC" font-size="10" font-weight="bold">Rayon de courbure : ρ = v² / aₙ</text>
  </g>

  <!-- Right: Mouvements Clés au Sénégal (TER MRUV & MCU) -->
  <g transform="translate(600, 75)">
    <rect width="270" height="375" fill="#1E293B" rx="12" stroke="#334155" stroke-width="1"/>
    <text x="15" y="30" fill="#E2E8F0" font-size="13" font-weight="700">3. Applications au Sénégal</text>
    <text x="15" y="48" fill="#94A3B8" font-size="10">TER Dakar-Diamniadio (MRUV) &amp; Virages</text>

    <!-- TER MRUV Card -->
    <g transform="translate(15, 65)">
      <rect width="240" height="110" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="12" y="20" fill="#38BDF8" font-size="10.5" font-weight="bold">🚄 TER Dakar : Freinage à Rufisque</text>
      
      <text x="12" y="40" fill="#CBD5E1" font-size="9">• Vitesse constante : MRU (a = 0)</text>
      <text x="12" y="55" fill="#CBD5E1" font-size="9">• Accélération / Freinage : MRUV (a = cte)</text>

      <!-- Torricelli Banner -->
      <rect x="10" y="65" width="220" height="35" rx="6" fill="#1E293B" stroke="#00B8A9" stroke-width="1"/>
      <text x="120" y="80" fill="#FBBF24" font-size="9" font-weight="bold" text-anchor="middle">Formule de Torricelli (Sans le temps) :</text>
      <text x="120" y="94" fill="#5EEAD4" font-size="11" font-weight="800" text-anchor="middle">v₂² - v₁² = 2 · a · (x₂ - x₁) = 2 · a · d</text>
    </g>

    <!-- MCU Card -->
    <g transform="translate(15, 185)">
      <rect width="240" height="100" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="12" y="20" fill="#C4B5FD" font-size="10.5" font-weight="bold">🎡 Mouvement Circulaire Uniforme</text>
      <text x="12" y="40" fill="#CBD5E1" font-size="9">• Vitesse angulaire : ω = dθ/dt = cte (rad/s)</text>
      <text x="12" y="56" fill="#CBD5E1" font-size="9">• Vitesse linéaire : v = R · ω (m/s)</text>
      <text x="12" y="72" fill="#FDA4AF" font-size="9" font-weight="bold">• aₜ = 0 &amp; aₙ = v²/R = R·ω² (Pur centripète)</text>
      <text x="12" y="88" fill="#F8FAFC" font-size="9">• Période T = 2π / ω  •  Fréquence f = 1/T</text>
    </g>

    <!-- Nature of Motion criteria -->
    <rect x="15" y="295" width="240" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="25" y="312" fill="#F8FAFC" font-size="9.5" font-weight="bold">Critère du Produit Scalaire a⃗ · v⃗ :</text>
    <text x="25" y="328" fill="#34D399" font-size="9">• a⃗ · v⃗ &gt; 0 ⟹ Mouvement Accéléré</text>
    <text x="25" y="342" fill="#F87171" font-size="9">• a⃗ · v⃗ &lt; 0 ⟹ Mouvement Retardé / Décéléré</text>
    <text x="25" y="356" fill="#60A5FA" font-size="9">• a⃗ · v⃗ = 0 ⟹ Mouvement Uniforme (v = cte)</text>
  </g>
</svg>
