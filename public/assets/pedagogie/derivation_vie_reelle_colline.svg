<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGradMamelles" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre Navy Al Muxtaar -->
  <rect width="800" height="540" rx="16" fill="url(#skyGradMamelles)"/>

  <!-- Titre & Bandeau Pédagogique -->
  <rect x="40" y="18" width="720" height="38" rx="8" fill="#14213D" stroke="#00F5D4" stroke-width="1"/>
  <text x="400" y="42" fill="#FFFFFF" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    ⛰️ Métaphore Concrète au Sénégal : La Dérivée = La Pente de la Colline des Mamelles
  </text>

  <!-- Zone Graphique -->
  <rect x="40" y="70" width="720" height="240" rx="14" fill="#0A0F1D" stroke="#334155" stroke-width="1.5"/>

  <!-- Profil de la Colline des Mamelles (Courbe f) -->
  <path d="M 60 270 Q 200 260 260 170 Q 340 90 400 90 Q 460 90 540 170 Q 600 260 740 270" 
        fill="none" stroke="#38BDF8" stroke-width="4"/>
  <path d="M 60 270 Q 200 260 260 170 Q 340 90 400 90 Q 460 90 540 170 Q 600 260 740 270 L 740 295 L 60 295 Z" 
        fill="url(#hillGrad)"/>

  <!-- Phare des Mamelles au sommet -->
  <rect x="394" y="55" width="12" height="35" fill="#E2E8F0" rx="2"/>
  <polygon points="390,55 410,55 400,45" fill="#F43F5E"/>
  <circle cx="400" cy="50" r="4" fill="#FEF08A"/>
  <text x="400" y="40" fill="#FEF08A" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Phare des Mamelles</text>

  <!-- 1. Montée : Pente positive (f'(x) > 0) -->
  <line x1="160" y1="260" x2="260" y2="150" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="263,147 253,153 259,159" fill="#10B981"/>
  <rect x="130" y="175" width="130" height="34" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="195" y="190" fill="#6EE7B7" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    Pente montante : f&apos;(x) &gt; 0
  </text>
  <text x="195" y="203" fill="#A7F3D0" font-size="9" font-family="sans-serif" text-anchor="middle">
    Fonction Croissante ↗
  </text>

  <!-- 2. Sommet : Tangente Horizontale (f'(x) = 0) -->
  <line x1="320" y1="90" x2="480" y2="90" stroke="#FBBF24" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="400" cy="90" r="7" fill="#FBBF24" filter="url(#glowGreen)"/>
  <circle cx="400" cy="90" r="3" fill="#0F172A"/>
  <rect x="330" y="105" width="140" height="32" rx="6" fill="#78350F" stroke="#FBBF24" stroke-width="1"/>
  <text x="400" y="120" fill="#FDE047" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    Tangente plate : f&apos;(x₀) = 0
  </text>
  <text x="400" y="132" fill="#FEF08A" font-size="9" font-family="sans-serif" text-anchor="middle">
    Maximum Local (Le Sommet)
  </text>

  <!-- 3. Descente : Pente négative (f'(x) < 0) -->
  <line x1="540" y1="150" x2="640" y2="260" stroke="#F43F5E" stroke-width="2.5"/>
  <polygon points="643,263 639,251 633,257" fill="#F43F5E"/>
  <rect x="540" y="175" width="130" height="34" rx="6" fill="#881337" stroke="#F43F5E" stroke-width="1"/>
  <text x="605" y="190" fill="#FDA4AF" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    Pente descendante : f&apos;(x) &lt; 0
  </text>
  <text x="605" y="203" fill="#FECDD3" font-size="9" font-family="sans-serif" text-anchor="middle">
    Fonction Décroissante ↘
  </text>

  <!-- =========================================================== -->
  <!-- Explication Pédagogique & Décodage Wolof                    -->
  <!-- =========================================================== -->
  <rect x="40" y="320" width="720" height="205" rx="12" fill="#0E1A38" stroke="#38BDF8" stroke-width="1.2"/>

  <!-- Titre -->
  <text x="60" y="344" fill="#00F5D4" font-size="12" font-family="sans-serif" font-weight="bold">
    🎯 CE QU&apos;IL FAUT RETENIR (EN FRANÇAIS &amp; EN WOLOF) :
  </text>

  <!-- Français : label + lignes courtes -->
  <text x="60" y="367" font-family="sans-serif" font-size="11">
    <tspan fill="#E2E8F0">• </tspan><tspan font-weight="bold" fill="#FBBF24">Français :</tspan>
  </text>
  <text x="72" y="383" fill="#E2E8F0" font-size="11" font-family="sans-serif">
    La dérivée f&apos;(x₀) mesure la pente instantanée : si f&apos;(x) &gt; 0 la courbe grimpe, si f&apos;(x) &lt; 0
  </text>
  <text x="72" y="398" fill="#E2E8F0" font-size="11" font-family="sans-serif">
    la courbe descend. Au sommet exact (ou creux), la pente s&apos;annule : f&apos;(x₀) = 0 (tangente horizontale).
  </text>
  <text x="72" y="413" fill="#94A3B8" font-size="10" font-family="sans-serif">
    Équation de la tangente : (T) : y = f&apos;(x₀)(x - x₀) + f(x₀).
  </text>

  <!-- Wolof : label + lignes courtes -->
  <text x="60" y="438" font-family="sans-serif" font-size="11">
    <tspan fill="#E2E8F0">• </tspan><tspan font-weight="bold" fill="#38BDF8">Wolof :</tspan>
  </text>
  <text x="72" y="454" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    « Dérivée mooy wax doole ak wet gi yoon bi di jëm ci benn tàccu waxtu :
  </text>
  <text x="72" y="469" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    boo yéeg toundu Mamelles f&apos;(x) &gt; 0 la (croissante), boo wàcc f&apos;(x) &lt; 0 la (décroissante).
  </text>
  <text x="72" y="484" fill="#E2E8F0" font-size="11" font-family="sans-serif" font-style="italic">
    Ci kocc bi (sommet) f&apos;(x₀) = 0 la : sa tànk day téye noom (tangente horizontale) ! »
  </text>

  <!-- Réflexe Bac S2 -->
  <text x="60" y="511" fill="#38BDF8" font-size="10" font-family="sans-serif" font-weight="bold">
    ⚡ Réflexe Bac S2 : f&apos;(x) s&apos;annule en changeant de signe ⟹ Extremum local à tangente horizontale.
  </text>
</svg>

