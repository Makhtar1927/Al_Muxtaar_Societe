<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#0B1E2E; font-family:system-ui, -apple-system, sans-serif; border-radius:16px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B8A9"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>
    <linearGradient id="tangentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B731"/>
      <stop offset="100%" stop-color="#FF5E3A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Grille & Fond -->
  <g stroke="#1A3A54" stroke-width="1" opacity="0.4">
    <line x1="80" y1="40" x2="80" y2="360"/>
    <line x1="160" y1="40" x2="160" y2="360"/>
    <line x1="240" y1="40" x2="240" y2="360"/>
    <line x1="320" y1="40" x2="320" y2="360"/>
    <line x1="400" y1="40" x2="400" y2="360"/>
    <line x1="480" y1="40" x2="480" y2="360"/>
    <line x1="560" y1="40" x2="560" y2="360"/>
    <line x1="640" y1="40" x2="640" y2="360"/>
    <line x1="720" y1="40" x2="720" y2="360"/>

    <line x1="50" y1="80" x2="750" y2="80"/>
    <line x1="50" y1="140" x2="750" y2="140"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="260" x2="750" y2="260"/>
    <line x1="50" y1="320" x2="750" y2="320"/>
  </g>

  <!-- Axes cartésiens -->
  <!-- Axe Ox -->
  <line x1="60" y1="340" x2="750" y2="340" stroke="#718BA5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="750,340 740,335 740,345" fill="#718BA5"/>
  <text x="745" y="365" fill="#A0B9D1" font-size="14" font-weight="bold">x</text>

  <!-- Axe Oy -->
  <line x1="100" y1="360" x2="100" y2="40" stroke="#718BA5" stroke-width="2.5"/>
  <polygon points="100,40 95,50 105,50" fill="#718BA5"/>
  <text x="75" y="50" fill="#A0B9D1" font-size="14" font-weight="bold">y</text>

  <!-- Courbe f(x) -->
  <path d="M 120,330 C 220,320 280,240 380,180 C 460,130 560,90 710,70" 
        fill="none" stroke="url(#curveGrad)" stroke-width="4.5" filter="url(#glow)"/>
  <text x="690" y="55" fill="#38EF7D" font-size="16" font-weight="900">Courbe (Cf)</text>

  <!-- Tangente (T) au point A(x0, f(x0)) -->
  <!-- Point A à x=360, y=190 -->
  <line x1="180" y1="280" x2="580" y2="80" stroke="url(#tangentGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="590" y="90" fill="#F7B731" font-size="15" font-weight="bold">Tangente (T) : pente = f&apos;(x₀)</text>

  <!-- Triangle de pente (Δx, Δy) -->
  <polygon points="360,190 520,190 520,110" fill="#F7B731" fill-opacity="0.12" stroke="#F7B731" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Annotations du triangle de pente -->
  <text x="430" y="210" fill="#F7B731" font-size="12" font-weight="bold">Δx = h</text>
  <text x="530" y="155" fill="#F7B731" font-size="12" font-weight="bold">Δy = f(x₀ + h) - f(x₀)</text>

  <!-- Point A (x0, f(x0)) -->
  <circle cx="360" cy="190" r="7" fill="#00B8A9" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)"/>
  <text x="315" y="180" fill="#FFFFFF" font-size="15" font-weight="black">Point A</text>

  <!-- Point B (x0+h, f(x0+h)) -->
  <circle cx="520" cy="110" r="5" fill="#F7B731" stroke="#FFFFFF" stroke-width="2"/>
  <text x="525" y="105" fill="#F7B731" font-size="13" font-weight="bold">M(x₀+h, f(x₀+h))</text>

  <!-- Projections sur les axes -->
  <!-- x0 -->
  <line x1="360" y1="190" x2="360" y2="340" stroke="#00B8A9" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="350" y="360" fill="#00B8A9" font-size="14" font-weight="black">x₀</text>

  <!-- x0 + h -->
  <line x1="520" y1="110" x2="520" y2="340" stroke="#F7B731" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="505" y="360" fill="#F7B731" font-size="14" font-weight="bold">x₀ + h</text>

  <!-- f(x0) -->
  <line x1="100" y1="190" x2="360" y2="190" stroke="#00B8A9" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="40" y="195" fill="#00B8A9" font-size="13" font-weight="bold">f(x₀)</text>

  <!-- Badge Formule Clé au Bac -->
  <rect x="230" y="15" width="340" height="42" rx="12" fill="#143048" stroke="#00B8A9" stroke-width="1.5"/>
  <text x="400" y="41" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">
    f&apos;(x₀) = lim (h → 0) [f(x₀+h) - f(x₀)] / h = Pente
  </text>
</svg>

