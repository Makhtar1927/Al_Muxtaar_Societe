<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-width:100%;display:block;background:#ffffff;border-radius:16px;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <style>
      @keyframes approachPoint {
        0% { transform: translate(0, 0); opacity: 0.2; }
        50% { transform: translate(110px, -65px); opacity: 1; }
        90% { transform: translate(140px, -82px); opacity: 1; }
        100% { transform: translate(140px, -82px); opacity: 0; }
      }
      @keyframes pulseTarget {
        0%, 100% { r: 6px; fill-opacity: 0.9; }
        50% { r: 9px; fill-opacity: 0.4; }
      }
      .curve { stroke: #0B6477; stroke-width: 3.5; fill: none; stroke-linecap: round; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis { stroke: #143048; stroke-width: 2; stroke-linecap: round; }
      .axis-arrow { fill: #143048; }
      .point-moving { animation: approachPoint 4s ease-in-out infinite; }
      .target-point { animation: pulseTarget 2s ease-in-out infinite; }
      .guide-line { stroke: #14B8A6; stroke-width: 2; stroke-dasharray: 5 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#143048"/>
    </marker>
  </defs>

  <!-- En-tête pédagogique -->
  <rect x="0" y="0" width="700" height="50" fill="#F8FAFC" rx="16"/>
  <text x="25" y="32" font-size="14" font-weight="bold" fill="#143048">Visualisation Dynamique : Notion de Limite en un Point</text>
  <rect x="520" y="14" width="155" height="24" rx="12" fill="#E0F2FE"/>
  <text x="597" y="30" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">lim f(x) = L quand x → x₀</text>

  <!-- Grille -->
  <line x1="80" y1="90" x2="640" y2="90" class="grid-line" />
  <line x1="80" y1="160" x2="640" y2="160" class="grid-line" />
  <line x1="80" y1="230" x2="640" y2="230" class="grid-line" />
  <line x1="80" y1="300" x2="640" y2="300" class="grid-line" />

  <!-- Axes -->
  <line x1="100" y1="320" x2="640" y2="320" class="axis" marker-end="url(#arrow)" />
  <line x1="120" y1="330" x2="120" y2="70" class="axis" marker-end="url(#arrow)" />
  <text x="635" y="340" font-size="13" font-weight="bold" fill="#143048">x</text>
  <text x="105" y="75" font-size="13" font-weight="bold" fill="#143048">y</text>
  <text x="105" y="335" font-size="12" fill="#64748B">0</text>

  <!-- Lignes directrices de la cible (x0, L) -->
  <line x1="420" y1="320" x2="420" y2="160" class="guide-line" />
  <line x1="120" y1="160" x2="420" y2="160" class="guide-line" />

  <!-- Étiquettes de la cible -->
  <circle cx="420" cy="320" r="4" fill="#0B6477"/>
  <text x="420" y="340" font-size="13" font-weight="bold" fill="#0B6477" text-anchor="middle">x₀</text>

  <circle cx="120" cy="160" r="4" fill="#0B6477"/>
  <text x="100" y="165" font-size="13" font-weight="bold" fill="#0B6477" text-anchor="end">L</text>

  <!-- Courbe f(x) -->
  <path d="M 140 300 C 220 280, 320 210, 420 160 C 500 120, 560 105, 620 95" class="curve" />
  <text x="590" y="85" font-size="13" font-weight="bold" fill="#0B6477">𝓒_f</text>

  <!-- Point cible fixe avec pulsation -->
  <circle cx="420" cy="160" r="6" fill="#14B8A6" class="target-point"/>
  <circle cx="420" cy="160" r="3" fill="#ffffff"/>

  <!-- Point animé qui s'approche de (x0, L) -->
  <g class="point-moving">
    <!-- Point sur la courbe partant de (260, 245) vers (400, 163) -->
    <circle cx="260" cy="245" r="5" fill="#F59E0B" />
    <!-- Ligne de projection vers x -->
    <line x1="260" y1="245" x2="260" y2="320" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Point sur l'axe x -->
    <circle cx="260" cy="320" r="3.5" fill="#F59E0B"/>
    <!-- Étiquette mobile -->
    <text x="260" y="338" font-size="11" font-weight="bold" fill="#F59E0B" text-anchor="middle">x →</text>
  </g>

  <!-- Légende pédagogique nette et aérée (aucun texte ne déborde) -->
  <rect x="150" y="75" width="225" height="70" rx="10" fill="#FFFFFF" stroke="#0B6477" stroke-width="1.5"/>
  <rect x="150" y="75" width="225" height="70" rx="10" fill="#F0FDFA" opacity="0.6"/>
  <text x="165" y="98" font-size="12" font-weight="bold" fill="#0B6477">Comportement de f(x) :</text>
  <text x="165" y="117" font-size="11" fill="#334155">Lorsque x s&apos;approche de x₀,</text>
  <text x="165" y="134" font-size="11.5" font-weight="bold" fill="#0F766E">f(x) converge vers la limite L.</text>
</svg>
