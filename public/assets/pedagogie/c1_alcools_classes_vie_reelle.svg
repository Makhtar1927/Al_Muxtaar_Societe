<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#0F172A; font-family:system-ui, sans-serif;">
  <rect width="900" height="450" fill="#0B132B" rx="16"/>
  <rect x="2" y="2" width="896" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="14"/>
  
  <g transform="translate(450, 32)" text-anchor="middle">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text y="5" fill="#38BDF8" font-size="13" font-weight="800" letter-spacing="1">C1 : LES 3 CLASSES D'ALCOOLS &amp; APPLICATIONS RÉELLES</text>
  </g>

  <!-- 3 Classes Cards -->
  <!-- Classe 1 -->
  <g transform="translate(40, 75)">
    <rect width="250" height="230" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect x="12" y="12" width="226" height="28" rx="6" fill="#064E3B"/>
    <text x="125" y="31" fill="#34D399" font-size="12" font-weight="800" text-anchor="middle">CLASSE I : PRIMAIRE (1°)</text>
    <text x="125" y="70" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">R — CH₂ — OH</text>
    <text x="20" y="105" fill="#94A3B8" font-size="11">Carbone fonctionnel lié à :</text>
    <text x="20" y="125" fill="#34D399" font-size="12" font-weight="700">★ Au plus 1 seul carbone</text>
    <path d="M 20 145 L 230 145" stroke="#334155" stroke-width="1"/>
    <text x="20" y="165" fill="#E2E8F0" font-size="11" font-weight="600">Exemple : Éthanol (CH₃-CH₂-OH)</text>
    <text x="20" y="185" fill="#94A3B8" font-size="10.5">Test Lucas : Aucun trouble à froid</text>
    <text x="20" y="205" fill="#FBBF24" font-size="10.5" font-weight="600">Oxydation : Aldéhyde ➜ Acide</text>
  </g>

  <!-- Classe 2 -->
  <g transform="translate(325, 75)">
    <rect width="250" height="230" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="226" height="28" rx="6" fill="#0C4A6E"/>
    <text x="125" y="31" fill="#38BDF8" font-size="12" font-weight="800" text-anchor="middle">CLASSE II : SECONDAIRE (2°)</text>
    <text x="125" y="70" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">R — CH(OH) — R&apos;</text>
    <text x="20" y="105" fill="#94A3B8" font-size="11">Carbone fonctionnel lié à :</text>
    <text x="20" y="125" fill="#38BDF8" font-size="12" font-weight="700">★ Exactement 2 carbones</text>
    <path d="M 20 145 L 230 145" stroke="#334155" stroke-width="1"/>
    <text x="20" y="165" fill="#E2E8F0" font-size="11" font-weight="600">Exemple : Propan-2-ol</text>
    <text x="20" y="185" fill="#94A3B8" font-size="10.5">Test Lucas : Trouble en ~5 min</text>
    <text x="20" y="205" fill="#FBBF24" font-size="10.5" font-weight="600">Oxydation : Cétone unique</text>
  </g>

  <!-- Classe 3 -->
  <g transform="translate(610, 75)">
    <rect width="250" height="230" rx="12" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="12" y="12" width="226" height="28" rx="6" fill="#4C0519"/>
    <text x="125" y="31" fill="#FB7185" font-size="12" font-weight="800" text-anchor="middle">CLASSE III : TERTIAIRE (3°)</text>
    <text x="125" y="70" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">R — C(OH)(R&apos;) — R&apos;&apos;</text>
    <text x="20" y="105" fill="#94A3B8" font-size="11">Carbone fonctionnel lié à :</text>
    <text x="20" y="125" fill="#FB7185" font-size="12" font-weight="700">★ 3 carbones (aucun H sur C)</text>
    <path d="M 20 145 L 230 145" stroke="#334155" stroke-width="1"/>
    <text x="20" y="165" fill="#E2E8F0" font-size="11" font-weight="600">Exemple : 2-méthylpropan-2-ol</text>
    <text x="20" y="185" fill="#94A3B8" font-size="10.5">Test Lucas : Trouble immédiat (&lt;30s)</text>
    <text x="20" y="205" fill="#EF4444" font-size="10.5" font-weight="600">Oxydation ménagée : IMPOSSIBLE</text>
  </g>

  <!-- Real life banner Senegal -->
  <g transform="translate(40, 325)">
    <rect width="820" height="100" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="35" cy="50" r="18" fill="#F59E0B" opacity="0.2"/>
    <text x="35" y="55" fill="#FBBF24" font-size="18" text-anchor="middle">🌍</text>
    <text x="65" y="32" fill="#FBBF24" font-size="12" font-weight="800">APPLICATION CONCRÈTE AU SÉNÉGAL &amp; VIE RÉELLE :</text>
    <text x="65" y="52" fill="#E2E8F0" font-size="11">1. <tspan font-weight="700" fill="#38BDF8">Gel hydroalcoolique &amp; Hôpitaux :</tspan> L'éthanol à 70° détruit la membrane lipidique des virus et bactéries grâce à ses liaisons hydrogène.</text>
    <text x="65" y="70" fill="#E2E8F0" font-size="11">2. <tspan font-weight="700" fill="#10B981">Fermentation locale (Vin de palme / Toupiti) :</tspan> Les levures transforment le glucose en éthanol : C₆H₁₂O₆ ➜ 2 C₂H₅OH + 2 CO₂.</text>
    <text x="65" y="88" fill="#CBD5E1" font-size="10.5" font-style="italic">« Éthanol bi mooy alcool antiseptique bu ñuy faje ci dispensaire yi, te dafa am liaisons hydrogène yu dëgër ! »</text>
  </g>
</svg>