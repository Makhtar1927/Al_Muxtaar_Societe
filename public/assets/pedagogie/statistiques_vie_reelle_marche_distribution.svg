<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="statBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <linearGradient id="statPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="statGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="url(#statBgGrad)" rx="16"/>

  <!-- Top Banner -->
  <rect x="40" y="16" width="720" height="38" rx="8" fill="#1E293B" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="400" y="41" fill="#00F5D4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    MÉTAPHORE CONCRÈTE AU SÉNÉGAL : LES STATISTIQUES AU MARCHÉ CENTRAL DE SANDAGA
  </text>

  <!-- LEFT PANEL: Nuage de Points & Point Moyen G -->
  <rect x="40" y="66" width="345" height="240" rx="12" fill="url(#statPanelGrad)" stroke="#334155" stroke-width="1.2"/>
  <text x="212" y="90" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    1. Nuage de Points &amp; Point Moyen G(x̄, ȳ)
  </text>

  <!-- Axes Ox and Oy -->
  <line x1="80" y1="260" x2="350" y2="260" stroke="#64748B" stroke-width="1.5"/>
  <line x1="80" y1="260" x2="80" y2="105" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="352,260 345,256 345,264" fill="#64748B"/>
  <polygon points="80,103 76,110 84,110" fill="#64748B"/>
  <text x="350" y="275" fill="#94A3B8" font-size="9" text-anchor="end">X (Quantité en sacs)</text>
  <text x="75" y="100" fill="#94A3B8" font-size="9">Y (Prix en FCFA)</text>

  <!-- Grid lines -->
  <line x1="140" y1="260" x2="140" y2="110" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="200" y1="260" x2="200" y2="110" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="260" y1="260" x2="260" y2="110" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="80" y1="210" x2="340" y2="210" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="80" y1="160" x2="340" y2="160" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Data points M_i -->
  <circle cx="110" cy="245" r="4.5" fill="#38BDF8"/>
  <circle cx="140" cy="230" r="4.5" fill="#38BDF8"/>
  <circle cx="170" cy="205" r="4.5" fill="#38BDF8"/>
  <circle cx="210" cy="180" r="4.5" fill="#38BDF8"/>
  <circle cx="250" cy="155" r="4.5" fill="#38BDF8"/>
  <circle cx="280" cy="135" r="4.5" fill="#38BDF8"/>
  <circle cx="310" cy="120" r="4.5" fill="#38BDF8"/>

  <!-- Droite de régression (D) : y = ax + b passant par G -->
  <line x1="90" y1="258" x2="330" y2="112" stroke="#00F5D4" stroke-width="2.2" filter="url(#statGlow)"/>

  <!-- Point Moyen G -->
  <circle cx="210" cy="180" r="6" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2"/>
  <text x="218" y="174" fill="#FBBF24" font-size="11" font-weight="bold">G(x̄, ȳ)</text>

  <text x="212" y="295" fill="#CBD5E1" font-size="9.5" text-anchor="middle">
    Le Point Moyen G est le centre de gravité : la droite (D) y passe obligatoirement !
  </text>

  <!-- RIGHT PANEL: Droites (D) et (D') et Corrélation r -->
  <rect x="415" y="66" width="345" height="240" rx="12" fill="url(#statPanelGrad)" stroke="#334155" stroke-width="1.2"/>
  <text x="587" y="90" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    2. Les 2 Droites d'Ajustement &amp; Corrélation r
  </text>

  <!-- Box Droite (D) -->
  <rect x="430" y="105" width="315" height="52" rx="8" fill="#0B132B" stroke="#00F5D4" stroke-width="1"/>
  <text x="445" y="124" fill="#00F5D4" font-size="11" font-weight="bold">(D_Y/X) : y = ax + b</text>
  <text x="445" y="142" fill="#E2E8F0" font-size="9.5">a = Cov(X,Y)/V(X) | Pour prédire Y (prix) connaissant X (sacs)</text>

  <!-- Box Droite (D') -->
  <rect x="430" y="165" width="315" height="52" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1"/>
  <text x="445" y="184" fill="#38BDF8" font-size="11" font-weight="bold">(D'_X/Y) : x = a'y + b'</text>
  <text x="445" y="202" fill="#E2E8F0" font-size="9.5">a' = Cov(X,Y)/V(Y) | Pour prédire X connaissant Y (ne pas inverser D !)</text>

  <!-- Box Corrélation r -->
  <rect x="430" y="225" width="315" height="48" rx="8" fill="#0B132B" stroke="#FBBF24" stroke-width="1"/>
  <text x="587" y="244" fill="#FBBF24" font-size="10.5" font-weight="bold" text-anchor="middle">
    r = Cov(X,Y) / (σ_X · σ_Y)   avec   |r| ≥ 0,87
  </text>
  <text x="587" y="261" fill="#E2E8F0" font-size="9" text-anchor="middle">
    Si |r| ≥ 0,87, la corrélation est forte : l'ajustement linéaire est validé !
  </text>

  <text x="587" y="295" fill="#CBD5E1" font-size="9.5" text-anchor="middle">
    Règle d'or : r² = a · a' garantit l'exactitude de vos calculs de pentes
  </text>

  <!-- BOTTOM PANEL: Explication complète Français + Wolof (lignes courtes < 85 car.) -->
  <rect x="40" y="320" width="720" height="205" rx="12" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2"/>

  <!-- En-tête du bas -->
  <rect x="55" y="330" width="690" height="24" rx="5" fill="#1E293B"/>
  <text x="70" y="346" fill="#38BDF8" font-size="11" font-weight="bold">
    🇸🇳 DÉCRYPTAGE BAC S2 &amp; VIE COURANTE : STATISTIQUES AU MARCHÉ
  </text>

  <!-- Texte Français (Lignes scindées) -->
  <text x="60" y="372" fill="#E2E8F0" font-size="10" font-weight="bold">
    En Français :
  </text>
  <text x="135" y="372" fill="#E2E8F0" font-size="10">
    Dans une série double, on observe le lien entre deux grandeurs réelles au Sénégal.
  </text>
  <text x="60" y="388" fill="#E2E8F0" font-size="10">
    • Exemple : quantité d'engrais (X) et récolte d'arachides à Kaolack (Y).
  </text>
  <text x="60" y="404" fill="#E2E8F0" font-size="10">
    • Le point moyen G(x̄, ȳ) est le centre de gravité : toute droite d'ajustement doit y passer.
  </text>
  <text x="60" y="420" fill="#E2E8F0" font-size="10">
    • Pour prédire Y sachant X, on utilise (D). Pour prédire X sachant Y, on utilise (D') !
  </text>

  <!-- Séparateur -->
  <line x1="60" y1="432" x2="740" y2="432" stroke="#334155" stroke-width="1"/>

  <!-- Texte Wolof (Lignes scindées) -->
  <text x="60" y="450" fill="#FBBF24" font-size="10" font-weight="bold">
    Ci Wolof (Xam-xam) :
  </text>
  <text x="180" y="450" fill="#FDE047" font-size="9.5" font-style="italic">
    « Statistiques doubles dafa lay won ni ñaari mbir di wéye ci marcha bi :
  </text>
  <text x="60" y="468" fill="#FDE047" font-size="9.5" font-style="italic">
    - Point moyen G(x̄, ȳ) mooy diggu marcha bi : droite bi faw mu jaar foofu bu ko kenn wacc.
  </text>
  <text x="60" y="484" fill="#FDE047" font-size="9.5" font-style="italic">
    - Covariance Cov(X,Y) moo lay wax ndax li ngay jaay ak njeg li dañuy ànd di yéeg walla wàcc.
  </text>
  <text x="60" y="500" fill="#FDE047" font-size="9.5" font-style="italic">
    - Coeff r bu tollook 0,87 walla gën ko : kon jënd ak jaay bi am na yoon bu jub, mënees na wax li koy am ! »
  </text>
</svg>