<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#0F172A; font-family:system-ui, sans-serif;">
  <rect width="900" height="450" fill="#0B132B" rx="16"/>
  <rect x="2" y="2" width="896" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="14"/>
  
  <g transform="translate(450, 32)" text-anchor="middle">
    <rect x="-260" y="-16" width="520" height="32" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text y="5" fill="#60A5FA" font-size="13" font-weight="800" letter-spacing="1">C6 : TITRAGE ACIDE FORT / BASE FORTE (HCl + NaOH)</text>
  </g>

  <!-- Plot Area -->
  <g transform="translate(40, 75)">
    <rect width="450" height="230" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- Axes -->
    <line x1="50" y1="200" x2="420" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="50" y1="200" x2="50" y2="20" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="420" y="218" fill="#94A3B8" font-size="11" text-anchor="end">Volume de soude Vb (mL)</text>
    <text x="40" y="25" fill="#94A3B8" font-size="11" text-anchor="end">pH</text>
    <!-- pH 7 Line -->
    <line x1="50" y1="110" x2="420" y2="110" stroke="#10B981" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="45" y="114" fill="#10B981" font-size="10" font-weight="700" text-anchor="end">pH=7</text>
    <!-- Symmetric S curve -->
    <path d="M 50 185 C 150 183, 210 175, 230 160 C 238 140, 242 80, 250 60 C 270 45, 330 38, 420 35" fill="none" stroke="#60A5FA" stroke-width="3.5"/>
    <!-- Equivalence E(VbE, pHe=7) -->
    <circle cx="240" cy="110" r="6" fill="#0F172A" stroke="#10B981" stroke-width="3"/>
    <line x1="240" y1="110" x2="240" y2="200" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="240" y="215" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">VbE</text>
    <text x="255" y="105" fill="#34D399" font-size="11" font-weight="800">E (pHe = 7,00 exact)</text>
  </g>

  <!-- Rules Card -->
  <g transform="translate(510, 75)">
    <rect width="350" height="230" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="175" y="30" fill="#60A5FA" font-size="12" font-weight="800" text-anchor="middle">RÈGLES D'OR DU DOSAGE FORT-FORT</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="11">1. <tspan font-weight="700" fill="#34D399">Équivalence rigoureusement neutre :</tspan></text>
    <text x="35" y="85" fill="#CBD5E1" font-size="10.5">À 25°C, pHe = 7,00 car H₃O⁺ + OH⁻ ➜ 2 H₂O.</text>
    <text x="35" y="100" fill="#CBD5E1" font-size="10.5">La solution obtenue est de l'eau salée (NaCl neutre).</text>

    <text x="20" y="125" fill="#F8FAFC" font-size="11">2. <tspan font-weight="700" fill="#FBBF24">Indicateur coloré idéal : Le BBT !</tspan></text>
    <text x="35" y="145" fill="#CBD5E1" font-size="10.5">Zone de virage [6,0 - 7,6] englobe 7,00.</text>
    <text x="35" y="160" fill="#FBBF24" font-size="10.5">Teinte sensible verte visible au millilitre près.</text>

    <text x="20" y="185" fill="#F8FAFC" font-size="11">3. <tspan font-weight="700" fill="#EF4444">Pas de demi-équivalence :</tspan></text>
    <text x="35" y="205" fill="#CBD5E1" font-size="10.5">Pas d'équilibre chimique partiel ni de pKa ici !</text>
  </g>

  <!-- Real life banner Senegal -->
  <g transform="translate(40, 325)">
    <rect width="820" height="100" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="35" cy="50" r="18" fill="#F59E0B" opacity="0.2"/>
    <text x="35" y="55" fill="#FBBF24" font-size="18" text-anchor="middle">🏭</text>
    <text x="65" y="32" fill="#FBBF24" font-size="12" font-weight="800">APPLICATION RÉELLE : DÉTARTRAGE &amp; NEUTRALISATION INDUSTRIELLE :</text>
    <text x="65" y="52" fill="#E2E8F0" font-size="11">1. <tspan font-weight="700" fill="#60A5FA">Détartrage des installations à Dakar :</tspan> L'acide chlorhydrique dissout le calcaire (CaCO₃) des canalisations avec dégagement de CO₂.</text>
    <text x="65" y="70" fill="#E2E8F0" font-size="11">2. <tspan font-weight="700" fill="#34D399">Traitement des eaux usées :</tspan> Les rejets acides des usines sont neutralisés à la soude jusqu'à pHe = 7 avant rejet en mer.</text>
    <text x="65" y="88" fill="#CBD5E1" font-size="10.5" font-style="italic">« Équivalence dosage fort-fort bi mooy 7 exact ! BBT mooy champion bi ndax dafay soppiku vert ci 7 pile. »</text>
  </g>
</svg>