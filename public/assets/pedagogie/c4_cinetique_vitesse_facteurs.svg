<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#0F172A; font-family:system-ui, sans-serif;">
  <rect width="900" height="450" fill="#0B132B" rx="16"/>
  <rect x="2" y="2" width="896" height="446" fill="none" stroke="#334155" stroke-width="1.5" rx="14"/>
  
  <g transform="translate(450, 32)" text-anchor="middle">
    <rect x="-260" y="-16" width="520" height="32" rx="16" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
    <text y="5" fill="#22D3EE" font-size="13" font-weight="800" letter-spacing="1">C4 : CINÉTIQUE CHIMIQUE, FACTEURS &amp; TEMPS DE DEMI-RÉACTION</text>
  </g>

  <!-- Curve x(t) and Tangent -->
  <g transform="translate(40, 75)">
    <rect width="450" height="230" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- Axes -->
    <line x1="50" y1="200" x2="420" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="50" y1="200" x2="50" y2="20" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="420" y="218" fill="#94A3B8" font-size="11" text-anchor="end">Temps t (min)</text>
    <text x="40" y="25" fill="#94A3B8" font-size="11" text-anchor="end">x(t) mol</text>
    <!-- x_max line -->
    <line x1="50" y1="50" x2="420" y2="50" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="420" y="45" fill="#EF4444" font-size="10" text-anchor="end">x_max (avancement final)</text>
    <!-- Curve -->
    <path d="M 50 200 C 100 90, 180 55, 420 50" fill="none" stroke="#22D3EE" stroke-width="3"/>
    <!-- t_1/2 projection -->
    <line x1="50" y1="125" x2="160" y2="125" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="160" y1="125" x2="160" y2="200" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="160" cy="125" r="4" fill="#F59E0B"/>
    <text x="160" y="215" fill="#F59E0B" font-size="10" font-weight="700" text-anchor="middle">t₁/₂</text>
    <text x="45" y="129" fill="#F59E0B" font-size="10" font-weight="700" text-anchor="end">x_max/2</text>
    <!-- Tangent at t=0 -->
    <line x1="50" y1="200" x2="170" y2="30" stroke="#10B981" stroke-width="1.5"/>
    <text x="150" y="25" fill="#10B981" font-size="10" font-weight="700">Pente = Vitesse max à t=0</text>
  </g>

  <!-- Key Formulas -->
  <g transform="translate(510, 75)">
    <rect width="350" height="230" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
    <text x="175" y="30" fill="#22D3EE" font-size="12" font-weight="800" text-anchor="middle">FORMULES CLÉS DU BAC S2</text>
    <rect x="15" y="45" width="320" height="45" rx="8" fill="#0F172A"/>
    <text x="175" y="73" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">v(t) = (1/V) · (dx/dt)</text>
    <text x="175" y="110" fill="#94A3B8" font-size="11" text-anchor="middle">La vitesse diminue au cours du temps car</text>
    <text x="175" y="125" fill="#EF4444" font-size="11" font-weight="700" text-anchor="middle">les réactifs s'épuisent (C diminue) !</text>
    
    <path d="M 20 140 L 330 140" stroke="#334155" stroke-width="1"/>
    <text x="25" y="160" fill="#FBBF24" font-size="11.5" font-weight="700">Les 4 Facteurs Cinétiques du Bac :</text>
    <text x="25" y="180" fill="#CBD5E1" font-size="10.5">1. Température T  |  2. Concentrations initiales</text>
    <text x="25" y="200" fill="#CBD5E1" font-size="10.5">3. Catalyseur spécifique  |  4. Surface de contact</text>
  </g>

  <!-- Real life banner Senegal -->
  <g transform="translate(40, 325)">
    <rect width="820" height="100" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="35" cy="50" r="18" fill="#F59E0B" opacity="0.2"/>
    <text x="35" y="55" fill="#FBBF24" font-size="18" text-anchor="middle">☕</text>
    <text x="65" y="32" fill="#FBBF24" font-size="12" font-weight="800">APPLICATION DE LA VIE RÉELLE : LA PRÉPARATION DU THÉ ATTAYA :</text>
    <text x="65" y="52" fill="#E2E8F0" font-size="11">1. <tspan font-weight="700" fill="#EF4444">Pourquoi fait-on bouillir l'Attaya ?</tspan> L'élévation de température augmente l'agitation thermique et le nombre de chocs efficaces, accélérant l'extraction.</text>
    <text x="65" y="70" fill="#E2E8F0" font-size="11">2. <tspan font-weight="700" fill="#38BDF8">Pourquoi met-on les aliments au frigo ?</tspan> La trempe thermique ralentit la vitesse d'oxydation et de dégradation bactérienne (facteur cinétique négatif).</text>
    <text x="65" y="88" fill="#CBD5E1" font-size="10.5" font-style="italic">« Attaya bu tàng dafay gaaw a jur couleur bi ndax tàngaay bi dafay yokk vitesse bi ! Frigo bi dafay tënk vitesse bi ba dara du yàqu. »</text>
  </g>
</svg>