<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond style Al Muxtaar Navy -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Grille discrète -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="60" y1="60" x2="740" y2="60"/>
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="180" x2="740" y2="180"/>
    <line x1="60" y1="240" x2="740" y2="240"/>
    <line x1="60" y1="300" x2="740" y2="300"/>
    <line x1="60" y1="360" x2="740" y2="360"/>
    <line x1="60" y1="420" x2="740" y2="420"/>

    <line x1="120" y1="40" x2="120" y2="440"/>
    <line x1="200" y1="40" x2="200" y2="440"/>
    <line x1="280" y1="40" x2="280" y2="440"/>
    <line x1="360" y1="40" x2="360" y2="440"/>
    <line x1="440" y1="40" x2="440" y2="440"/>
    <line x1="520" y1="40" x2="520" y2="440"/>
    <line x1="600" y1="40" x2="600" y2="440"/>
    <line x1="680" y1="40" x2="680" y2="440"/>
  </g>

  <!-- Axes du repère : Origine O à (360, 360) -->
  <!-- Axe Ox et Asymptote Horizontale y = 0 à gauche -->
  <line x1="60" y1="360" x2="740" y2="360" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="740,360 730,355 730,365" fill="#94A3B8"/>
  <text x="745" y="365" fill="#94A3B8" font-size="14" font-family="sans-serif" font-weight="bold">x</text>

  <!-- Asymptote Horizontale y = 0 (axe Ox pour x < 0) mise en évidence -->
  <line x1="60" y1="358" x2="340" y2="358" stroke="#FF6B6B" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="70" y="345" fill="#FF6B6B" font-size="12" font-family="sans-serif" font-weight="bold">Asymptote horizontale y = 0 en -∞</text>

  <!-- Axe Oy -->
  <line x1="360" y1="440" x2="360" y2="40" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="360,40 355,50 365,50" fill="#94A3B8"/>
  <text x="365" y="45" fill="#94A3B8" font-size="14" font-family="sans-serif" font-weight="bold">y</text>

  <!-- Origine O -->
  <text x="342" y="378" fill="#94A3B8" font-size="13" font-family="sans-serif">O</text>

  <!-- Graduations Ox : 1 unité = 100px -->
  <!-- x = -2 (160), -1 (260), 1 (460), 2 (560) -->
  <line x1="260" y1="355" x2="260" y2="365" stroke="#FFFFFF" stroke-width="2"/>
  <text x="250" y="380" fill="#94A3B8" font-size="12" font-family="sans-serif">-1</text>

  <line x1="460" y1="355" x2="460" y2="365" stroke="#FFFFFF" stroke-width="2"/>
  <text x="455" y="380" fill="#00F5D4" font-size="13" font-family="sans-serif" font-weight="bold">1</text>

  <line x1="560" y1="355" x2="560" y2="365" stroke="#FFFFFF" stroke-width="2"/>
  <text x="555" y="380" fill="#94A3B8" font-size="12" font-family="sans-serif">2</text>

  <!-- Graduations Oy : 1 unité = 70px vers le haut -->
  <!-- y = 1 (px = 360, py = 360 - 70 = 290) -->
  <line x1="355" y1="290" x2="365" y2="290" stroke="#FFFFFF" stroke-width="2"/>
  <text x="340" y="294" fill="#00F5D4" font-size="13" font-family="sans-serif" font-weight="bold">1</text>

  <!-- Point (0, 1) -->
  <circle cx="360" cy="290" r="5" fill="#00F5D4" filter="url(#glow)"/>
  <text x="375" y="295" fill="#00F5D4" font-size="13" font-family="sans-serif" font-weight="bold">(0, 1) : e⁰ = 1</text>

  <!-- Tangente en (0, 1) : y = x + 1 (pente = 1) -->
  <!-- x = -1 -> y = 0 (260, 360) ; x = 1 -> y = 2 (460, 220) -->
  <line x1="230" y1="381" x2="480" y2="206" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="220" y="405" fill="#38BDF8" font-size="12" font-family="sans-serif">Tangente T₀ : y = x + 1 (pente = 1)</text>

  <!-- Point (1, e) : x=1 -> 460, y=e≈2.718 -> py = 360 - 70*2.718 = 170 -->
  <line x1="460" y1="360" x2="460" y2="170" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="360" y1="170" x2="460" y2="170" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="460" cy="170" r="5" fill="#FBBF24" filter="url(#glow)"/>
  <text x="325" y="174" fill="#FBBF24" font-size="13" font-family="sans-serif" font-weight="bold">e ≈ 2,72</text>
  <text x="475" y="165" fill="#FBBF24" font-size="13" font-family="sans-serif" font-weight="bold">(1, e) : e¹ = e</text>

  <!-- Courbe exponentielle : y = e^x -->
  <!--
    x = -3.0 (px = 60,  y = 360 - 70*0.05 = 356)
    x = -2.0 (px = 160, y = 360 - 70*0.135 = 350)
    x = -1.0 (px = 260, y = 360 - 70*0.368 = 334)
    x = 0.0  (px = 360, y = 290)
    x = 0.5  (px = 410, y = 360 - 70*1.648 = 244)
    x = 1.0  (px = 460, y = 170)
    x = 1.5  (px = 510, y = 360 - 70*4.48 = 46)
    x = 1.6  (px = 520, y = 13)
  -->
  <path d="M 60 358 C 160 354, 250 342, 330 310 C 370 290, 420 230, 460 170 C 490 120, 515 50, 525 15"
        fill="none" stroke="url(#curveGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Badge Formules Clés Bac S2 -->
  <g transform="translate(530, 200)">
    <rect width="245" height="195" rx="12" fill="#0F172A" stroke="#00F5D4" stroke-width="1.5" opacity="0.95"/>
    <text x="16" y="28" fill="#00F5D4" font-size="14" font-family="sans-serif" font-weight="bold">Règles d'Or au Bac S2</text>
    <text x="16" y="55" fill="#E2E8F0" font-size="12" font-family="sans-serif">• Positivité : eˣ &gt; 0 ∀x ∈ ℝ</text>
    <text x="16" y="78" fill="#E2E8F0" font-size="12" font-family="sans-serif">• Dérivée : (eˣ)' = eˣ</text>
    <text x="16" y="101" fill="#E2E8F0" font-size="12" font-family="sans-serif">• Composée : (eᵘ)' = u' · eᵘ</text>
    <text x="16" y="124" fill="#FBBF24" font-size="12" font-family="sans-serif">• lim x→-∞ eˣ = 0 (Asymptote)</text>
    <text x="16" y="147" fill="#FBBF24" font-size="12" font-family="sans-serif">• lim x→+∞ eˣ/xⁿ = +∞</text>
    <text x="16" y="170" fill="#F43F5E" font-size="12" font-family="sans-serif">• lim x→-∞ xⁿ eˣ = 0</text>
  </g>

  <!-- Titre Principal -->
  <text x="30" y="36" fill="#FFFFFF" font-size="18" font-family="sans-serif" font-weight="bold">Fonction Exponentielle : Allure, Tangentes &amp; Asymptote</text>
</svg>

