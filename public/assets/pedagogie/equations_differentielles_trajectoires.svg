<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="diffBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="sol1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="sol2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="diffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre Navy Al Muxtaar -->
  <rect width="800" height="480" rx="16" fill="url(#diffBgGrad)"/>

  <!-- Grille discrète -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="50" y1="80" x2="750" y2="80"/>
    <line x1="50" y1="140" x2="750" y2="140"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="260" x2="750" y2="260"/>
    <line x1="50" y1="320" x2="750" y2="320"/>
    <line x1="50" y1="380" x2="750" y2="380"/>

    <line x1="120" y1="40" x2="120" y2="440"/>
    <line x1="200" y1="40" x2="200" y2="440"/>
    <line x1="280" y1="40" x2="280" y2="440"/>
    <line x1="360" y1="40" x2="360" y2="440"/>
    <line x1="440" y1="40" x2="440" y2="440"/>
    <line x1="520" y1="40" x2="520" y2="440"/>
    <line x1="600" y1="40" x2="600" y2="440"/>
    <line x1="680" y1="40" x2="680" y2="440"/>
  </g>

  <!-- Repère et Axes (Origine O à 260, 260) -->
  <line x1="60" y1="260" x2="740" y2="260" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="740,260 730,255 730,265" fill="#94A3B8"/>
  <text x="745" y="265" fill="#94A3B8" font-size="14" font-family="sans-serif" font-weight="bold">x</text>

  <line x1="260" y1="440" x2="260" y2="50" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="260,50 255,60 265,60" fill="#94A3B8"/>
  <text x="265" y="48" fill="#94A3B8" font-size="14" font-family="sans-serif" font-weight="bold">y</text>
  <text x="245" y="278" fill="#94A3B8" font-size="14" font-family="sans-serif">O</text>

  <!-- Courbe 1 : Solution de y' = ay (ex: y = 2 e^(-0.8x)) -->
  <path d="M 80 80 Q 200 200, 260 210 T 400 250 T 700 260" fill="none" stroke="url(#sol1Grad)" stroke-width="3.5" filter="url(#diffGlow)"/>
  
  <!-- Courbe 2 : Solution oscillante de y'' + w²y = 0 (ex: y = A cos(wx) + B sin(wx)) -->
  <path d="M 80 260 Q 140 120, 200 260 T 320 260 T 440 260 T 560 260 T 680 260" fill="none" stroke="url(#sol2Grad)" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Tangente en x=0 pour condition initiale y(0)=y0, y'(0)=v0 -->
  <circle cx="260" cy="210" r="5" fill="#00F5D4"/>
  <text x="272" y="205" fill="#00F5D4" font-size="13" font-family="sans-serif" font-weight="bold">y(0) = k (Condition Initiale)</text>

  <!-- Boîte Pédagogique 1 : 1er Ordre -->
  <rect x="70" y="330" width="310" height="95" rx="12" fill="#0E1A38" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="85" y="355" fill="#00F5D4" font-size="13" font-family="sans-serif" font-weight="bold">1er ORDRE : y' + ay = b</text>
  <text x="85" y="380" fill="#E2E8F0" font-size="12" font-family="sans-serif">Solution générale : y(x) = C·e^(-ax) + b/a</text>
  <text x="85" y="405" fill="#94A3B8" font-size="11" font-family="sans-serif">La constante C est déterminée par y(x₀) = y₀</text>

  <!-- Boîte Pédagogique 2 : 2nd Ordre -->
  <rect x="420" y="330" width="340" height="95" rx="12" fill="#0E1A38" stroke="#FBBF24" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="435" y="355" fill="#FBBF24" font-size="13" font-family="sans-serif" font-weight="bold">2nd ORDRE : y'' + ω²y = 0</text>
  <text x="435" y="380" fill="#E2E8F0" font-size="12" font-family="sans-serif">Solutions oscillantes : A·cos(ωx) + B·sin(ωx)</text>
  <text x="435" y="405" fill="#94A3B8" font-size="11" font-family="sans-serif">Constantes fixées par 2 conditions : y(0) et y'(0)</text>

  <!-- Titre Principal de l'infographie -->
  <rect x="70" y="25" width="410" height="40" rx="8" fill="#14213d" stroke="#38BDF8" stroke-width="1"/>
  <text x="85" y="50" fill="#FFFFFF" font-size="14" font-family="sans-serif" font-weight="bold">
    🎯 Équations Différentielles au Bac S2 : Trajectoires &amp; Solutions
  </text>
</svg>

