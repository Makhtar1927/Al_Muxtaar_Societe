<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-width:100%;display:block;background:#ffffff;border-radius:16px;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <style>
      @keyframes squeezeOscillation {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .curve-g { stroke: #3B82F6; stroke-width: 2.5; fill: none; }
      .curve-h { stroke: #EF4444; stroke-width: 2.5; fill: none; }
      .curve-f { stroke: #10B981; stroke-width: 3.5; fill: none; stroke-linecap: round; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis { stroke: #143048; stroke-width: 2; stroke-linecap: round; }
      .guide-line { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .f-oscillation { animation: squeezeOscillation 3s ease-in-out infinite; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#143048"/>
    </marker>
  </defs>

  <!-- En-tête -->
  <rect x="0" y="0" width="700" height="50" fill="#F8FAFC" rx="16"/>
  <text x="25" y="32" font-size="14" font-weight="bold" fill="#143048">Théorème d&apos;Encadrement (Théorème des Gendarmes)</text>
  <rect x="490" y="14" width="185" height="24" rx="12" fill="#ECFDF5"/>
  <text x="582" y="30" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">g(x) ≤ f(x) ≤ h(x) ⟹ lim f(x) = L</text>

  <!-- Grille -->
  <line x1="80" y1="100" x2="640" y2="100" class="grid-line" />
  <line x1="80" y1="180" x2="640" y2="180" class="grid-line" />
  <line x1="80" y1="260" x2="640" y2="260" class="grid-line" />

  <!-- Axes -->
  <line x1="80" y1="310" x2="640" y2="310" class="axis" marker-end="url(#arrow)" />
  <line x1="100" y1="320" x2="100" y2="70" class="axis" marker-end="url(#arrow)" />
  <text x="635" y="330" font-size="13" font-weight="bold" fill="#143048">x</text>
  <text x="85" y="75" font-size="13" font-weight="bold" fill="#143048">y</text>

  <!-- Ligne cible L et x0 -->
  <line x1="420" y1="310" x2="420" y2="180" class="guide-line" />
  <line x1="100" y1="180" x2="420" y2="180" class="guide-line" />
  <text x="420" y="330" font-size="13" font-weight="bold" fill="#143048" text-anchor="middle">x₀</text>
  <text x="85" y="185" font-size="13" font-weight="bold" fill="#143048" text-anchor="end">L</text>

  <!-- Zone en étau (remplissage léger entre g et h) -->
  <path d="M 120 100 Q 280 150, 420 180 Q 280 210, 120 260 Z" fill="#F1F5F9" opacity="0.6"/>

  <!-- Courbe h(x) (au-dessus - rouge) -->
  <path d="M 120 100 Q 260 140, 420 180 Q 520 210, 620 230" class="curve-h" />
  <text x="140" y="115" font-size="12" font-weight="bold" fill="#EF4444">h(x) [Majorant]</text>

  <!-- Courbe g(x) (en-dessous - bleu) -->
  <path d="M 120 260 Q 260 220, 420 180 Q 520 150, 620 130" class="curve-g" />
  <text x="140" y="275" font-size="12" font-weight="bold" fill="#3B82F6">g(x) [Minorant]</text>

  <!-- Courbe f(x) (prise en étau - vert) avec petite oscillation -->
  <g class="f-oscillation">
    <path d="M 120 170 C 180 130, 220 220, 280 160 C 340 190, 380 175, 420 180 C 460 185, 500 170, 560 180 C 590 185, 610 175, 620 178" class="curve-f" />
  </g>
  <text x="285" y="150" font-size="13" font-weight="bold" fill="#10B981">f(x) [Piégée]</text>

  <!-- Point de pincement L -->
  <circle cx="420" cy="180" r="6" fill="#10B981" />
  <circle cx="420" cy="180" r="10" stroke="#10B981" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Boîte explicative en bas à droite -->
  <rect x="450" y="235" width="230" height="68" rx="10" fill="#F8FAFC" stroke="#0D9488" stroke-width="1.5"/>
  <text x="465" y="256" font-size="11.5" font-weight="bold" fill="#0F172A">Effet d&apos;étau :</text>
  <text x="465" y="274" font-size="10.5" fill="#475569">Puisque h(x) et g(x) tendent vers L,</text>
  <text x="465" y="291" font-size="10.5" font-weight="bold" fill="#10B981">f(x) est piégée et converge vers L !</text>
</svg>
