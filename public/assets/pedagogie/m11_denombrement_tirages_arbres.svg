<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background-color: #0b1528; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="cardSimulGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardSansRemiseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardAvecRemiseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowTurquoise" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Decorative Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="65" x2="900" y2="65" />
    <line x1="0" y1="130" x2="900" y2="130" />
    <line x1="0" y1="195" x2="900" y2="195" />
    <line x1="0" y1="260" x2="900" y2="260" />
    <line x1="0" y1="325" x2="900" y2="325" />
    <line x1="0" y1="390" x2="900" y2="390" />
    <line x1="0" y1="455" x2="900" y2="455" />
    <line x1="150" y1="0" x2="150" y2="520" />
    <line x1="300" y1="0" x2="300" y2="520" />
    <line x1="450" y1="0" x2="450" y2="520" />
    <line x1="600" y1="0" x2="600" y2="520" />
    <line x1="750" y1="0" x2="750" y2="520" />
  </g>

  <!-- HEADER -->
  <rect x="25" y="20" width="850" height="70" rx="16" fill="url(#headerGrad)" opacity="0.12" stroke="#0284c7" stroke-width="1.5" />
  <text x="450" y="48" fill="#38bdf8" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1">
    M11 : ARBRE DE DÉCISION DU DÉNOMBREMENT • BACCALAURÉAT S2
  </text>
  <text x="450" y="74" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">
    Choisir le bon modèle en 2 questions : L'ORDRE compte-t-il ? Y a-t-il RÉPÉTITION ?
  </text>

  <!-- COLONNE 1 : TIRAGE SIMULTANÉ -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="265" height="380" rx="20" fill="url(#cardSimulGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="265" height="45" rx="20" fill="#10b981" opacity="0.2" />
    
    <text x="132" y="28" fill="#34d399" font-size="15" font-weight="800" text-anchor="middle">
      1. SIMULTANÉ (D'un coup)
    </text>

    <!-- Badges -->
    <rect x="20" y="58" width="105" height="24" rx="8" fill="#065f46" />
    <text x="72" y="74" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">Ordre : NON ✕</text>

    <rect x="135" y="58" width="110" height="24" rx="8" fill="#065f46" />
    <text x="190" y="74" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">Répétition : NON ✕</text>

    <!-- Formula Box -->
    <rect x="20" y="96" width="225" height="85" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="1.5" />
    <text x="132" y="122" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">COMBINAISONS</text>
    <text x="132" y="152" fill="#ffffff" font-size="22" font-weight="900" text-anchor="middle">
      C<tspan font-size="15" dy="5">n</tspan><tspan font-size="15" dy="-10">p</tspan><tspan font-size="20" dy="5"> = </tspan><tspan font-size="18">n! / [p!(n-p)!]</tspan>
    </text>

    <!-- Propriétés Clés -->
    <text x="25" y="205" fill="#f8fafc" font-size="12" font-weight="700">• Propriétés Clés :</text>
    <text x="35" y="225" fill="#cbd5e1" font-size="11.5">• Symétrie : C<tspan font-size="9">n</tspan><tspan font-size="9" dy="-5">p</tspan><tspan font-size="11.5" dy="5"> = C</tspan><tspan font-size="9">n</tspan><tspan font-size="9" dy="-5">n-p</tspan></text>
    <text x="35" y="245" fill="#cbd5e1" font-size="11.5">• Formule de Pascal :</text>
    <text x="45" y="265" fill="#34d399" font-size="12" font-weight="700">C<tspan font-size="9">n</tspan><tspan font-size="9" dy="-4">p</tspan><tspan font-size="12" dy="4"> = C</tspan><tspan font-size="9">n-1</tspan><tspan font-size="9" dy="-4">p</tspan><tspan font-size="12" dy="4"> + C</tspan><tspan font-size="9">n-1</tspan><tspan font-size="9" dy="-4">p-1</tspan></text>

    <!-- Analogie Vie Réelle -->
    <rect x="15" y="285" width="235" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="305" fill="#38bdf8" font-size="11" font-weight="800">🇸🇳 Vie Réelle Sénégal :</text>
    <text x="25" y="325" fill="#94a3b8" font-size="10.5">Choisir 3 élèves pour représenter le lycée</text>
    <text x="25" y="342" fill="#94a3b8" font-size="10.5">au Concours Général : l'ordre n'a aucune</text>
    <text x="25" y="358" fill="#94a3b8" font-size="10.5">importance, ils voyagent tous ensemble !</text>
  </g>

  <!-- COLONNE 2 : SUCCESSIF SANS REMISE -->
  <g transform="translate(315, 110)">
    <rect x="0" y="0" width="270" height="380" rx="20" fill="url(#cardSansRemiseGrad)" stroke="#38bdf8" stroke-width="2" />
    <rect x="0" y="0" width="270" height="45" rx="20" fill="#38bdf8" opacity="0.2" />
    
    <text x="135" y="28" fill="#38bdf8" font-size="15" font-weight="800" text-anchor="middle">
      2. SUCCESSIF SANS REMISE
    </text>

    <!-- Badges -->
    <rect x="25" y="58" width="105" height="24" rx="8" fill="#0369a1" />
    <text x="77" y="74" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">Ordre : OUI ✓</text>

    <rect x="140" y="58" width="105" height="24" rx="8" fill="#0c4a6e" />
    <text x="192" y="74" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">Répétition : NON ✕</text>

    <!-- Formula Box -->
    <rect x="20" y="96" width="230" height="85" rx="14" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
    <text x="135" y="122" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">ARRANGEMENTS</text>
    <text x="135" y="152" fill="#ffffff" font-size="22" font-weight="900" text-anchor="middle">
      A<tspan font-size="15" dy="5">n</tspan><tspan font-size="15" dy="-10">p</tspan><tspan font-size="20" dy="5"> = </tspan><tspan font-size="18">n! / (n - p)!</tspan>
    </text>

    <!-- Propriétés Clés -->
    <text x="25" y="205" fill="#f8fafc" font-size="12" font-weight="700">• Cas Particulier : Permutations</text>
    <text x="35" y="225" fill="#cbd5e1" font-size="11.5">• Si p = n (tous les éléments) :</text>
    <text x="45" y="245" fill="#38bdf8" font-size="13" font-weight="800">A<tspan font-size="9">n</tspan><tspan font-size="9" dy="-4">n</tspan><tspan font-size="13" dy="4"> = n! = n × (n-1) × ... × 1</tspan></text>
    <text x="35" y="267" fill="#cbd5e1" font-size="11.5">• Lien : A<tspan font-size="9">n</tspan><tspan font-size="9" dy="-4">p</tspan><tspan font-size="11.5" dy="4"> = p! × C</tspan><tspan font-size="9">n</tspan><tspan font-size="9" dy="-4">p</tspan></text>

    <!-- Analogie Vie Réelle -->
    <rect x="15" y="285" width="240" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="305" fill="#f59e0b" font-size="11" font-weight="800">🇸🇳 Navétanes &amp; Lutte :</text>
    <text x="25" y="325" fill="#94a3b8" font-size="10.5">Podium (1er, 2e, 3e prix) : l'ordre est</text>
    <text x="25" y="342" fill="#94a3b8" font-size="10.5">décisif (champion ≠ dauphin) et un lutteur</text>
    <text x="25" y="358" fill="#94a3b8" font-size="10.5">ne peut pas occuper deux places à la fois !</text>
  </g>

  <!-- COLONNE 3 : SUCCESSIF AVEC REMISE -->
  <g transform="translate(605, 110)">
    <rect x="0" y="0" width="265" height="380" rx="20" fill="url(#cardAvecRemiseGrad)" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="265" height="45" rx="20" fill="#f59e0b" opacity="0.2" />
    
    <text x="132" y="28" fill="#fbbf24" font-size="15" font-weight="800" text-anchor="middle">
      3. SUCCESSIF AVEC REMISE
    </text>

    <!-- Badges -->
    <rect x="20" y="58" width="105" height="24" rx="8" fill="#78350f" />
    <text x="72" y="74" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">Ordre : OUI ✓</text>

    <rect x="135" y="58" width="110" height="24" rx="8" fill="#78350f" />
    <text x="190" y="74" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">Répétition : OUI ✓</text>

    <!-- Formula Box -->
    <rect x="20" y="96" width="225" height="85" rx="14" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
    <text x="132" y="122" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">p-LISTES (n-uplets)</text>
    <text x="132" y="154" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle">
      N = n<tspan font-size="16" dy="-8">p</tspan>
    </text>

    <!-- Propriétés Clés -->
    <text x="25" y="205" fill="#f8fafc" font-size="12" font-weight="700">• Principe Multiplicatif :</text>
    <text x="35" y="225" fill="#cbd5e1" font-size="11.5">• Choix 1 : n possibilités</text>
    <text x="35" y="245" fill="#cbd5e1" font-size="11.5">• Choix 2 : n possibilités</text>
    <text x="35" y="265" fill="#fbbf24" font-size="12" font-weight="700">• Choix p : n possibilités → n<tspan font-size="9" dy="-4">p</tspan></text>

    <!-- Analogie Vie Réelle -->
    <rect x="15" y="285" width="235" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="305" fill="#10b981" font-size="11" font-weight="800">🇸🇳 Code Wave / Orange Money :</text>
    <text x="25" y="325" fill="#94a3b8" font-size="10.5">Code secret à 4 chiffres (0 à 9) : l'ordre</text>
    <text x="25" y="342" fill="#94a3b8" font-size="10.5">compte (1234 ≠ 4321) et on peut répéter :</text>
    <text x="25" y="358" fill="#94a3b8" font-size="10.5">10 × 10 × 10 × 10 = 10⁴ = 10 000 codes !</text>
  </g>
</svg>

