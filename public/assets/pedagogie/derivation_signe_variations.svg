<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%" style="background:#081521; font-family:system-ui, -apple-system, sans-serif; border-radius:16px;">
  <defs>
    <linearGradient id="mountGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B8A9"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>
    <linearGradient id="descGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="100%" stop-color="#FF2A6D"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Titre de la figure -->
  <text x="410" y="32" fill="#FFFFFF" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">
    LIEN FONDAMENTAL : SIGNE DE f&apos;(x) ⟷ VARIATIONS DE f(x)
  </text>

  <!-- ZONE 1 : COURBE QUI MONTE (f' > 0) -->
  <g transform="translate(40, 60)">
    <!-- Carte Fond -->
    <rect width="220" height="230" rx="14" fill="#0E2438" stroke="#00B8A9" stroke-width="1.5"/>
    <text x="110" y="28" fill="#00B8A9" font-size="14" font-weight="900" text-anchor="middle">1. f&apos;(x) &gt; 0</text>
    <text x="110" y="48" fill="#A0B9D1" font-size="11" text-anchor="middle">Pente positive (monte)</text>

    <!-- Mini graphe -->
    <line x1="20" y1="180" x2="200" y2="180" stroke="#1A3A54" stroke-width="1.5"/>
    <!-- Courbe montante -->
    <path d="M 30,160 Q 110,130 190,70" fill="none" stroke="url(#mountGrad)" stroke-width="4" filter="url(#neon)"/>
    <!-- Tangente -->
    <line x1="70" y1="150" x2="150" y2="80" stroke="#F7B731" stroke-width="2.5" stroke-dasharray="4,3"/>
    
    <!-- Flèche de variation -->
    <circle cx="110" cy="115" r="5" fill="#F7B731"/>
    <text x="110" y="215" fill="#38EF7D" font-size="13" font-weight="bold" text-anchor="middle">
      ↗ f est strictement croissante
    </text>
  </g>

  <!-- ZONE 2 : SOMMET / TANGENTE HORIZONTALE (f' = 0) -->
  <g transform="translate(300, 60)">
    <!-- Carte Fond -->
    <rect width="220" height="230" rx="14" fill="#0E2438" stroke="#F7B731" stroke-width="2"/>
    <text x="110" y="28" fill="#F7B731" font-size="14" font-weight="900" text-anchor="middle">2. f&apos;(x₀) = 0</text>
    <text x="110" y="48" fill="#A0B9D1" font-size="11" text-anchor="middle">Pente nulle (tangente plate)</text>

    <!-- Mini graphe -->
    <line x1="20" y1="180" x2="200" y2="180" stroke="#1A3A54" stroke-width="1.5"/>
    <!-- Courbe avec sommet cloche -->
    <path d="M 30,150 Q 110,60 190,150" fill="none" stroke="#F7B731" stroke-width="4" filter="url(#neon)"/>
    <!-- Tangente STRICTEMENT HORIZONTALE -->
    <line x1="40" y1="90" x2="180" y2="90" stroke="#00B8A9" stroke-width="3"/>
    
    <!-- Point sommet -->
    <circle cx="110" cy="90" r="6" fill="#FFFFFF" stroke="#00B8A9" stroke-width="2"/>
    <text x="110" y="215" fill="#F7B731" font-size="13" font-weight="bold" text-anchor="middle">
      — Maximum local en x₀
    </text>
  </g>

  <!-- ZONE 3 : COURBE QUI DESCEND (f' < 0) -->
  <g transform="translate(560, 60)">
    <!-- Carte Fond -->
    <rect width="220" height="230" rx="14" fill="#0E2438" stroke="#FF5E3A" stroke-width="1.5"/>
    <text x="110" y="28" fill="#FF5E3A" font-size="14" font-weight="900" text-anchor="middle">3. f&apos;(x) &lt; 0</text>
    <text x="110" y="48" fill="#A0B9D1" font-size="11" text-anchor="middle">Pente négative (descend)</text>

    <!-- Mini graphe -->
    <line x1="20" y1="180" x2="200" y2="180" stroke="#1A3A54" stroke-width="1.5"/>
    <!-- Courbe descendante -->
    <path d="M 30,70 Q 110,130 190,160" fill="none" stroke="url(#descGrad)" stroke-width="4" filter="url(#neon)"/>
    <!-- Tangente descendante -->
    <line x1="70" y1="80" x2="150" y2="150" stroke="#F7B731" stroke-width="2.5" stroke-dasharray="4,3"/>
    
    <!-- Point milieu -->
    <circle cx="110" cy="115" r="5" fill="#F7B731"/>
    <text x="110" y="215" fill="#FF5E3A" font-size="13" font-weight="bold" text-anchor="middle">
      ↘ f est strictement décroissante
    </text>
  </g>

  <!-- TABLEAU DE VARIATION SYNTHÉTIQUE AU BAS -->
  <g transform="translate(40, 310)">
    <rect width="740" height="110" rx="12" fill="#0B1E2E" stroke="#1A3A54" stroke-width="1.5"/>
    
    <!-- Ligne de séparation en-tête -->
    <line x1="0" y1="40" x2="740" y2="40" stroke="#1A3A54" stroke-width="1.5"/>
    <line x1="160" y1="0" x2="160" y2="110" stroke="#1A3A54" stroke-width="1.5"/>

    <!-- Labels gauche -->
    <text x="80" y="26" fill="#A0B9D1" font-size="13" font-weight="bold" text-anchor="middle">Signe de f&apos;(x)</text>
    <text x="80" y="80" fill="#A0B9D1" font-size="13" font-weight="bold" text-anchor="middle">Variations de f</text>

    <!-- Colonnes -->
    <!-- Col 1 : + -->
    <text x="260" y="27" fill="#38EF7D" font-size="18" font-weight="black" text-anchor="middle">+</text>
    <text x="260" y="82" fill="#38EF7D" font-size="20" font-weight="black" text-anchor="middle">↗</text>

    <!-- Col 2 : 0 -->
    <line x1="360" y1="0" x2="360" y2="110" stroke="#1A3A54" stroke-width="1"/>
    <text x="450" y="27" fill="#F7B731" font-size="16" font-weight="black" text-anchor="middle">0 (sommet)</text>
    <text x="450" y="80" fill="#F7B731" font-size="14" font-weight="black" text-anchor="middle">f(x₀) [Extremum]</text>

    <!-- Col 3 : - -->
    <line x1="540" y1="0" x2="540" y2="110" stroke="#1A3A54" stroke-width="1"/>
    <text x="640" y="27" fill="#FF5E3A" font-size="18" font-weight="black" text-anchor="middle">-</text>
    <text x="640" y="82" fill="#FF5E3A" font-size="20" font-weight="black" text-anchor="middle">↘</text>
  </g>
</svg>

