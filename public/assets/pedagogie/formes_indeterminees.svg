<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-width:100%;display:block;background:#ffffff;border-radius:16px;font-family:system-ui,-apple-system,sans-serif;">
  <!-- En-tête -->
  <rect x="0" y="0" width="700" height="50" fill="#143048" rx="16"/>
  <text x="25" y="32" font-size="14" font-weight="bold" fill="#ffffff">Fiche Réflexe Bac : Les 4 Formes Indéterminées &amp; Comment les Lever</text>
  <rect x="520" y="14" width="155" height="24" rx="12" fill="#0B6477"/>
  <text x="597" y="30" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Méthodes Terminale S2</text>

  <!-- Les 4 F.I. (en rouge/orange) -->
  <text x="25" y="85" font-size="13" font-weight="bold" fill="#991B1B">⚠️ Les 4 Seules Formes Indéterminées :</text>
  
  <g transform="translate(25, 98)">
    <!-- FI 1 -->
    <rect x="0" y="0" width="150" height="48" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="75" y="30" font-size="15" font-weight="black" fill="#DC2626" text-anchor="middle">" 0 / 0 "</text>

    <!-- FI 2 -->
    <rect x="165" y="0" width="150" height="48" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="240" y="30" font-size="15" font-weight="black" fill="#DC2626" text-anchor="middle">" ∞ / ∞ "</text>

    <!-- FI 3 -->
    <rect x="330" y="0" width="150" height="48" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="405" y="30" font-size="15" font-weight="black" fill="#DC2626" text-anchor="middle">" 0 × ∞ "</text>

    <!-- FI 4 -->
    <rect x="495" y="0" width="155" height="48" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="572" y="30" font-size="15" font-weight="black" fill="#DC2626" text-anchor="middle">" +∞ - ∞ "</text>
  </g>

  <!-- Ligne séparatrice -->
  <line x1="25" y1="168" x2="675" y2="168" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Les 3 Méthodes Types Bac Sénégal -->
  <text x="25" y="195" font-size="13" font-weight="bold" fill="#0B6477">✨ Les 3 Réflexes Officiels pour Lever l&apos;Indétermination :</text>

  <g transform="translate(25, 210)">
    <!-- Réflexe 1 -->
    <rect x="0" y="0" width="205" height="165" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0D9488"/>
    <text x="28" y="33" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="50" y="33" font-size="13" font-weight="bold" fill="#0F766E">Factorisation</text>
    <text x="15" y="62" font-size="11" font-weight="bold" fill="#134E4A">En ±∞</text>
    <text x="15" y="80" font-size="10.5" fill="#334155">Mettre en facteur le terme</text>
    <text x="15" y="96" font-size="10.5" fill="#334155">de plus haut degré.</text>
    <rect x="15" y="118" width="175" height="28" rx="6" fill="#ffffff" stroke="#CCFBF1"/>
    <text x="102" y="136" font-size="10" font-weight="bold" fill="#0F766E" text-anchor="middle">x²(a + b/x + c/x²)</text>

    <!-- Réflexe 2 -->
    <rect x="222" y="0" width="205" height="165" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <circle cx="250" cy="28" r="14" fill="#0D9488"/>
    <text x="250" y="33" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="272" y="33" font-size="13" font-weight="bold" fill="#0F766E">Quantité Conjuguée</text>
    <text x="237" y="62" font-size="11" font-weight="bold" fill="#134E4A">Avec racines carrées √</text>
    <text x="237" y="80" font-size="10.5" fill="#334155">Multiplier haut et bas par</text>
    <text x="237" y="96" font-size="10.5" fill="#334155">l&apos;expression conjuguée.</text>
    <rect x="237" y="118" width="175" height="28" rx="6" fill="#ffffff" stroke="#CCFBF1"/>
    <text x="324" y="136" font-size="9" font-weight="bold" fill="#0F766E" text-anchor="middle">(√A - B)(√A + B) = A - B²</text>

    <!-- Réflexe 3 -->
    <rect x="444" y="0" width="205" height="165" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <circle cx="472" cy="28" r="14" fill="#0D9488"/>
    <text x="472" y="33" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="494" y="33" font-size="13" font-weight="bold" fill="#0F766E">Taux de Variation</text>
    <text x="459" y="62" font-size="11" font-weight="bold" fill="#134E4A">Forme "0 / 0" en x₀</text>
    <text x="459" y="80" font-size="10.5" fill="#334155">Reconnaître le nombre dérivé :</text>
    <text x="459" y="96" font-size="10.5" fill="#334155">lim [f(x)-f(x₀)]/(x-x₀) = f&apos;(x₀)</text>
    <rect x="459" y="118" width="175" height="28" rx="6" fill="#ffffff" stroke="#CCFBF1"/>
    <text x="546" y="136" font-size="9.5" font-weight="bold" fill="#0F766E" text-anchor="middle">lim (sin x)/x = 1 en 0</text>
  </g>
</svg>
