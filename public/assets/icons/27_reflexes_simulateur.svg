  <linearGradient id="i27_n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55708F"/><stop offset=".5" stop-color="#2C4259"/><stop offset="1" stop-color="#17222F"/></linearGradient>
  <linearGradient id="i27_nd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35506A"/><stop offset=".5" stop-color="#1E3043"/><stop offset="1" stop-color="#0E1822"/></linearGradient>
