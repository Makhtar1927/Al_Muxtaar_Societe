  <linearGradient id="i26_w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#EAF1F6"/><stop offset="1" stop-color="#C9D8E3"/></linearGradient>
  <filter id="i26_b" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
