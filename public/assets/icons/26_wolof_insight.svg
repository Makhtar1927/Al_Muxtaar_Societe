<!-- Ombre au sol -->
<ellipse cx="128" cy="232" rx="74" ry="9" fill="#243447" opacity=".18" filter="url(#i26_b)"/>
<!-- Ampoule / idée lumineuse (corps) -->
<path d="M128 36 C96 36 76 60 76 88 C76 108 88 122 96 134 L96 158 Q96 166 104 166 L152 166 Q160 166 160 158 L160 134 C168 122 180 108 180 88 C180 60 160 36 128 36Z" fill="url(#i26_g)"/>
<path d="M128 36 C160 36 180 60 180 88 C180 108 168 122 160 134 L160 158 Q160 166 152 166 L128 166Z" fill="#D18305" opacity=".18"/>
<!-- Filament intérieur -->
<path d="M110 96 Q118 108 128 100 Q138 92 146 104" stroke="url(#i26_gd)" stroke-width="5" stroke-linecap="round" fill="none"/>
<!-- Rayons lumineux -->
<line x1="128" y1="24" x2="128" y2="14" stroke="#FFE69A" stroke-width="5" stroke-linecap="round"/>
<line x1="92" y1="40" x2="85" y2="33" stroke="#FFE69A" stroke-width="4" stroke-linecap="round"/>
<line x1="164" y1="40" x2="171" y2="33" stroke="#FFE69A" stroke-width="4" stroke-linecap="round"/>
<line x1="70" y1="72" x2="60" y2="68" stroke="#FFE69A" stroke-width="4" stroke-linecap="round"/>
<line x1="186" y1="72" x2="196" y2="68" stroke="#FFE69A" stroke-width="4" stroke-linecap="round"/>
<!-- Socle de l'ampoule (représente le Wolof / langue) -->
<rect x="104" y="168" width="48" height="10" rx="4" fill="url(#i26_gd)"/>
<rect x="108" y="180" width="40" height="10" rx="4" fill="url(#i26_gd)"/>
<!-- Petits traits symbolisant "Xam-xam" (connaissance en Wolof) -->
<rect x="112" y="192" width="32" height="5" rx="2.5" fill="url(#i26_n)" opacity=".5"/>
<rect x="116" y="200" width="24" height="5" rx="2.5" fill="url(#i26_n)" opacity=".35"/>
<!-- Lettre "W" stylisée discrète (Wolof) sur le corps de l'ampoule -->
<path d="M108 80 L112 100 L120 86 L128 100 L136 86 L144 100 L148 80" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".55"/>
